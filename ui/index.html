$("flagpop").addEventListener("click", function(e){
  e.stopPropagation();
  const b = e.target.closest("[data-fb]");
  if (!b) return;
  const id = b.closest(".chk").dataset.id;
  mark(S.checks.find(function(x){ return x.id === id; }), b.dataset.fb);
});
document.addEventListener("click", function(e){ if (!e.target.closest("#flag-wrap")) closeFlag(); });

/* E68: the brain registered a question, before any answer exists. A question it will answer gets
   a Heard slot under the answer's own id, so the answer replaces it in place when it lands. */
/* The server promises a card or a no-answer card for policy "answer" questions it is sure of and
   that are not objections; anything else may end in silence, so it gets no slot to get stuck on. */
function wantsSlot(m){
  return m.policy === "answer" && m.status === "heard" && m.via !== "repeat" && m.sure !== false && m.kind !== "objection";
}
function onQuestion(m){
  if (!m.aid) return;
  S.questions.set(m.aid, m);
  if (m.line) markQuestionLine(m.line, m.aid);
  refreshQuestionLines(m.aid);
  const slot = S.answers.find(function(a){ return a.id === m.aid; });
  if (wantsSlot(m)){
    if (!slot){
      if (m.via === "typed") S.pending = null;          // the typed ask's own placeholder becomes this slot
      pushAnswer({id:m.aid, _heard:true, question:m.text, who:m.who, ts:m.ts || now()});
    } else if (slot._heard && m.text && slot.question !== m.text){
      slot.question = m.text;                           // the settled final added words
      renderAnswers();
    }
  } else if (slot && slot._heard && m.status === "quiet"){
    S.answers = S.answers.filter(function(a){ return a !== slot; });   // no card will come for it
    renderAnswers();
  }
}
function markQuestionLine(line, aid){
  S.qlines.set(S.alias.get(line) || line, aid);
}
/* every line that asked this question (a repeat carries the first one's aid) shows its current status */
function refreshQuestionLines(aid){
  for (const [key, a] of S.qlines){
    if (a !== aid) continue;
    const l = S.lineIx.get(key);
    const el = l && $("tinner").querySelector('.tl[data-id="' + CSS.escape(key) + '"]');
    if (el) el.outerHTML = lineHTML(l);
  }
}

function pushAnswer(a){
  if (isCheck(a)) return pushCheck(a);              // not the answer to anything, so a pending ask keeps waiting
  const prev = S.answers.find(function(x){ return x.id === a.id; });
  if (prev && prev._open) a._open = true;
  const wasTop = !!S.answers[0] && S.answers[0].id === a.id;
  a._new = !wasTop;                                   // a streaming redraw of the top card does not re-animate
  if (prev && answeredFrom(a) === "web" && answeredFrom(prev) !== "web"){
    a._swap = true; a._new = false;                   // the files answer just became a web answer, in place
  }
  if (!prev) S.sel = null;                            // E12: the keys act on the top card, and this is it now
  S.answers = S.answers.filter(function(x){ return x.id !== a.id; });
  S.answers.unshift(a);
  if (S.answers.length > MAX_ANSWERS) S.answers.length = MAX_ANSWERS;
  if (!a._heard){ S.pending = null; setBusy(false); }     // any answer clears the ask bar's spinner
  renderAnswers();
}

/* --------------------------------------------------------------- on deck */
/* A candidate's `topic` joins up to three workbook labels, some of them whole sentences, so the
   chip never shows it whole. Ready: the figure, then the question it answers. Warming: the first
   topic. Everything else goes in the tooltip. */
function topicParts(c){
  return String(c.topic || "").replace(/^cache\s*·\s*/i, "").split(/\s+·\s+/).filter(Boolean);
}
function chipLabel(c){
  const q = String(c.question || "").trim();
  if (c.status === "ready" && q) return q;
  return topicParts(c)[0] || q || "Topic";
}
function chipHTML(c){
  const ready = c.status === "ready", shown = S.shown.has(c.id);
  const cls = shown ? "shown" : ready ? "ready" : "warming";
  const parts = topicParts(c), extra = ready && c.question ? 0 : parts.length - 1;
  const tip = [c.question, c.preview, parts.join(" · ")].filter(function(x){ return x && String(x).trim(); })
    .map(function(x){ return String(x).trim(); });
  return '<button class="chip ' + cls + '" data-id="' + esc(c.id) + '" title="' + esc(tip.join("\n\n")) + '"' +
    (ready && !shown ? "" : ' tabindex="-1"') + ">" +
    '<span class="dot ' + (shown ? "accent pulse" : ready ? "ok" : "warm pulse") + '"></span>' +
    (ready && c.figure ? '<span class="cfig">' + esc(fmtFigure(c.figure)) + "</span>" : "") +
    '<span class="lab">' + esc(chipLabel(c)) + "</span>" +
    (extra > 0 ? '<span class="more">+' + extra + "</span>" : "") + "</button>";
}
/* Ready chips first, since the strip clips at the right; two chips that would read the same
   (the same figure, or the same warming label) are one. */
function deckList(){
  const live = S.cands.filter(function(c){ return c.status !== "expired"; });
  const ready = live.filter(function(c){ return c.status === "ready"; });
  const seen = new Set(), out = [];
  for (const c of ready){
    // the same figure is the same fact, however the question was worded; without one, the question
    const k = c.figure ? "f|" + fmtFigure(c.figure) : "q|" + String(c.question || c.topic || "").toLowerCase().trim();
    if (seen.has(k)) continue;
    seen.add(k); out.push(c);
  }
  for (const c of live){
    if (c.status === "ready") continue;
    const k = "w|" + chipLabel(c).toLowerCase();
    if (seen.has(k)) continue;
    seen.add(k); out.push(c);
  }
  return out;
}
function renderDeck(){
  const list = deckList();
  const html = list.length ? list.map(chipHTML).join("")
    : '<span class="chip idle"><span class="dot"></span><span class="lab">Nothing warming</span></span>';
  if (LAST.deck === html) return;
  const before = new Set(Array.from($("chips").children).map(function(el){ return el.dataset.id; }));
  LAST.deck = html;
  $("chips").innerHTML = html;
  for (const el of $("chips").children) if (el.dataset.id && !before.has(el.dataset.id)) el.classList.add("arrive");
}
$("chips").addEventListener("click", function(e){
  const b = e.target.closest(".chip[data-id]");
  if (!b) return;
  const c = S.cands.find(function(x){ return x.id === b.dataset.id; });
  if (!c || c.status !== "ready" || S.shown.has(c.id)) return;
  S.shown.add(c.id);
  renderDeck();
  send({type:"show", id:c.id});
  if (MOCK) mockShow(c.id);
});

/* ------------------------------------------------------------ transcript */
/* `text` is the committed prefix; `unstable` is the tail the transcriber may still rewrite, dimmed. */
function lineStart(l){
  if (typeof l.ts === "number") return l.ts - Math.max(0, (Number(l.t1) || 0) - (Number(l.t0) || 0));
  return l.t0;
}
/* a line the brain registered as a question carries a small mark: grey until answered, green once
   a card is up, amber when it got a no-answer card */
const QMARK = {heard:["", "Heard as a question"], answered:["ok", "Answered"], "no-answer":["warm", "No answer yet"],
               quiet:["", "Heard, no card"]};
function qmark(l){
  const aid = S.qlines.get(l._key), qf = aid && S.questions.get(aid);
  const q = qf && QMARK[qf.status];
  return q ? '<i class="qmark ' + q[0] + '" title="' + q[1] + '"></i>' : "";
}
function lineHTML(l){
  const who = l.source === "mic" ? "Me" : (l.speaker && l.speaker !== "Me" ? "Them " + l.speaker : "Them");
  const tail = !l.final && l.unstable ? '<span class="uns">' + esc((l.text ? " " : "") + l.unstable) + "</span>" : "";
  return '<div class="tl ' + (l.source === "mic" ? "mic" : "system") + (l.final ? "" : " interim") +
    '" data-id="' + esc(l._key) + '"><span class="tt">' + fmtStamp(lineStart(l)) + qmark(l) + "</span>" +
    '<span class="who ' + (l.source === "mic" ? "mic" : "system") + '">' + esc(who) + "</span>" +
    '<span class="tx' + (l.heard ? ' fixed" title="' + esc("Heard as “" + l.heard + "”") : "") + '">' + esc(l.text) + tail + "</span></div>";
}
function atBottom(){
  const el = $("tlines");
  return el.scrollHeight - el.scrollTop - el.clientHeight < 44;
}
function stickBottom(was){
  if (was){ $("tlines").scrollTop = $("tlines").scrollHeight; $("latest").classList.remove("show"); }
  else if (S.tab === "transcript") $("latest").classList.add("show");
}
function renderTranscript(){
  $("tinner").innerHTML = S.lines.map(lineHTML).join("");
  $("tlines").scrollTop = $("tlines").scrollHeight;
  $("latest").classList.remove("show");
}
function noteStart(l){
  const t = lineStart(l);
  if (t == null || isNaN(t)) return false;
  if (S.callT0 == null || t < S.callT0){ S.callT0 = t; return true; }
  return false;
}
/* The server keys a line on (source, utt), and utt restarts at 0 when capture restarts, so an old
   id can come back for a new utterance. A final line whose id reappears well after it closed is a
   new line, not an edit (docs/frontend-asks.md has the server-side fix). */
function lineKey(m){
  let key = S.alias.get(m.id) || m.id;
  const prev = S.lineIx.get(key);
  if (prev && prev.final && !m.retracts && typeof m.ts === "number" && typeof prev.ts === "number" &&
      m.ts - prev.ts > REUSED_ID_S){
    key = m.id + "~" + (++S.aliasSeq);
    S.alias.set(m.id, key);
  }
  return key;
}
function onTranscript(m){
  if (!("unstable" in m)) m.unstable = "";            // absent means empty; a retract must not keep the old tail
  if (!("heard" in m)) m.heard = null;                // and absent means nothing was repaired on this frame
  const was = atBottom();
  const key = lineKey(m);
  const prev = S.lineIx.get(key);
  if (m.dropped){                                     // the mic heard the far side through the speakers
    if (prev){
      S.lines = S.lines.filter(function(l){ return l._key !== key; });
      S.lineIx.delete(key);
      const el = $("tinner").querySelector('.tl[data-id="' + CSS.escape(key) + '"]');
      if (el) el.remove();
    }
    return;
  }
  // an interim decode can lose the race with its own final and land after it; only a retract
  // may reopen a finished line
  if (prev && prev.final && !m.final && !m.retracts && m.t0 === prev.t0) return;
  const moved = noteStart(m);
  if (moved){
    if (prev) Object.assign(prev, m, {_key:key}); else { m._key = key; S.lines.push(m); S.lineIx.set(key, m); }
    trimLines();
    renderTranscript();
    return;
  }
  if (prev){
    Object.assign(prev, m, {_key:key});
    const el = $("tinner").querySelector('.tl[data-id="' + CSS.escape(key) + '"]');
    if (el) el.outerHTML = lineHTML(prev);
  } else {
    m._key = key;
    S.lines.push(m);
    S.lineIx.set(key, m);
    if (trimLines()){ const first = $("tinner").firstElementChild; if (first) first.remove(); }
    $("tinner").insertAdjacentHTML("beforeend", lineHTML(m));
  }
  stickBottom(was);
}
function trimLines(){
  if (S.lines.length <= MAX_LINES) return false;
  const gone = S.lines.shift();
  S.lineIx.delete(gone._key);
  return true;
}
$("tlines").addEventListener("scroll", function(){
  if (atBottom()) $("latest").classList.remove("show");
});
$("latest").addEventListener("click", function(){
  $("tlines").scrollTop = $("tlines").scrollHeight;
  $("latest").classList.remove("show");
});

/* ----------------------------------------------------------------- tune */
const TUNE = [
  {key:"topic_threshold",    label:"Topic",     min:0,  max:1,   step:.01, fmt:function(v){return v.toFixed(2);}},
  {key:"question_threshold", label:"Question",  min:0,  max:1,   step:.01, fmt:function(v){return v.toFixed(2);}},
  {key:"prefetch_cooldown_s",label:"Cooldown",  min:0,  max:30,  step:1,   fmt:function(v){return v + " s";}},
  {key:"max_warm",           label:"Max warm",  min:1,  max:12,  step:1,   fmt:function(v){return String(v);}},
  {key:"answer_ttl_s",       label:"Answer TTL",min:10, max:600, step:10,  fmt:function(v){return v + " s";}}
];
function pct(t, v){ return Math.round(((v - t.min) / (t.max - t.min)) * 100); }
function buildTune(){
  $("pop").innerHTML = TUNE.map(function(t){
    const v = Number(S.settings[t.key]);
    return '<div class="tune-row"><div class="tune-head"><span>' + t.label +
      '</span><b class="num" data-v="' + t.key + '">' + t.fmt(v) + "</b></div>" +
      '<input type="range" data-k="' + t.key + '" min="' + t.min + '" max="' + t.max +
      '" step="' + t.step + '" value="' + v + '" style="--p:' + pct(t, v) + '%"></div>';
  }).join("") +
  '<div class="tune-row"><div class="tune-head"><span>Web</span></div>' +
  '<div class="seg fill" id="web-seg"><button data-w="auto">Auto</button><button data-w="off">Off</button></div></div>';
}
function webMode(){ return S.settings.web_mode === "off" ? "off" : "auto"; }
function syncTune(){
  const seg = $("web-seg");
  if (seg) for (const b of seg.querySelectorAll("button")) b.classList.toggle("on", b.dataset.w === webMode());
  for (const t of TUNE){
    const v = Number(S.settings[t.key]);
    const r = $("pop").querySelector('input[data-k="' + t.key + '"]');
    const b = $("pop").querySelector('b[data-v="' + t.key + '"]');
    if (r && document.activeElement !== r){ r.value = v; r.style.setProperty("--p", pct(t, v) + "%"); }
    if (b) b.textContent = t.fmt(v);
  }
}
$("pop").addEventListener("input", function(e){
  const r = e.target.closest("input[data-k]");
  if (!r) return;
  const t = TUNE.find(function(x){ return x.key === r.dataset.k; });
  const v = Number(r.value);
  S.settings[t.key] = v;
  r.style.setProperty("--p", pct(t, v) + "%");
  const b = $("pop").querySelector('b[data-v="' + t.key + '"]');
  if (b) b.textContent = t.fmt(v);
  send({type:"set", key:t.key, value:v});
});
$("pop").addEventListener("click", function(e){
  const b = e.target.closest("button[data-w]");
  if (!b || b.dataset.w === webMode()) return;
  S.settings.web_mode = b.dataset.w;
  syncTune();
  send({type:"set", key:"web_mode", value:b.dataset.w});
});
$("tune-btn").addEventListener("click", function(e){

document.addEventListener("click", function(e){

$("clear-btn").addEventListener("click", function(){

function doClear(){

$("ask").addEventListener("keydown", function(e){

/* The footer's right side: the keys that do something right now, each one clickable. */
function hintList(){
  if (document.activeElement === $("ask")) return [["↵","Ask","ask"],["esc","Close","blur"]];
  const a = selectedAnswer();
  if (a){
    const out = [];
    if (canOpen(a)) out.push(["↵", a._open ? "Less" : "More", "open"]);
    if (!a._heard) out.push(["U","Used","used"], ["W","Wrong","wrong"]);
    if (S.answers.length > 1) out.push(["↑ ↓","Browse","browse"]);
    return out;
  }
  return [["1–6","Mode","mode"],["⌘,","Settings","settings"]];
}
function renderHints(){
  const items = hintList();
  const html = items.map(function(h){
    const keys = h[0].split(" ").map(function(k){ return '<span class="kbd">' + esc(k) + "</span>"; }).join("");
    return h[2] === "mode" ? '<span class="hint">' + keys + esc(h[1]) + "</span>"
      : '<button class="hint" data-act="' + h[2] + '" tabindex="-1">' + keys + esc(h[1]) + "</button>";
  }).join("");
  if (LAST.hints !== html){ LAST.hints = html; $("hints").innerHTML = html; }
}
function flashHint(act){
  const b = $("hints").querySelector('[data-act="' + act + '"] .kbd');
  if (!b) return;
  b.style.color = "var(--text-1)"; b.style.background = "var(--surface-sel)";
  setTimeout(function(){ b.style.color = ""; b.style.background = ""; }, 180);
}
$("hints").addEventListener("mousedown", function(e){ e.preventDefault(); });   // keep the ask box focused
$("hints").addEventListener("click", function(e){
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  if (act === "ask"){ $("ask").dispatchEvent(new KeyboardEvent("keydown", {key:"Enter"})); return; }
  if (act === "blur"){ $("ask").blur(); return; }
  if (act === "open") return toggleOpen(selectedAnswer());
  if (act === "used" || act === "wrong") return mark(selectedAnswer(), act);
  if (act === "browse") return moveSel(1);
  if (act === "settings") return openDrawer();
});

function typing(t){
  return !!t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable);
}
document.addEventListener("keydown", function(e){
  const mod = e.metaKey || e.ctrlKey;
  if (mod && (e.key === "k" || e.key === "K")){ e.preventDefault(); $("ask").focus(); $("ask").select(); return; }
  if (mod && e.key === ","){ e.preventDefault(); drawerOpen() ? closeDrawer() : openDrawer(); return; }
  if (mod && (e.key === "l" || e.key === "L")){ e.preventDefault(); toggleListening($("listen-top")); return; }
  if (e.key === "Escape"){
    if (drawerOpen()) return closeDrawer();
    if ($("pop").classList.contains("open")) return closeTune();
    if ($("flagpop").classList.contains("open")) return closeFlag();
    if (!typing(e.target)) collapseAll();
    return;
  }
  if (mod || e.altKey || typing(e.target) || drawerOpen() || GALLERY) return;
  if (/^[1-6]$/.test(e.key)){
    const m = modeList()[Number(e.key) - 1];
    if (m){ e.preventDefault(); setMode(m.id); }
    return;
  }
  if (e.key === "ArrowDown"){ e.preventDefault(); moveSel(1); return; }
  if (e.key === "ArrowUp"){ e.preventDefault(); moveSel(-1); return; }
  if (e.key === "Enter"){
    if (e.target && e.target.closest && e.target.closest("button,a")) return;   // reached by Tab: its own Enter
    const a = selectedAnswer();
    if (canOpen(a)){ e.preventDefault(); toggleOpen(a); flashHint("open"); }
    return;
  }
  // with the checks popover open, the keys mean the check on top of it, not the answer behind it
  const target = $("flagpop").classList.contains("open") ? S.checks[0] : selectedAnswer();
  if (e.key === "u" || e.key === "U"){ mark(target, "used"); return; }
  if (e.key === "w" || e.key === "W"){ mark(target, "wrong"); return; }
});

/* ------------------------------------------------------------- settings */
const SHEET = {xlsx:1, xlsm:1, xltx:1, xltm:1, csv:1, tsv:1};
const DOCK  = {pdf:1, docx:1, pptx:1, md:1, markdown:1, txt:1, text:1};
const KEY_PREFIX = {anthropic:"sk-ant-…", gemini:"AIza…"};
const FOLDER_ICON = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" ' +
  'stroke-width="1.3"><path d="M1.8 4.2h4l1.2 1.5h7.2v7.1H1.8z"/></svg>';

async function api(path, method, body){
  if (MOCK || GALLERY) return mockApi(path, method, body);
  const opt = {method: method || "GET"};
  if (body){ opt.headers = {"Content-Type":"application/json"}; opt.body = JSON.stringify(body); }
  let r;
  try { r = await fetch(path, opt); } catch(e){ return {error:"server unreachable"}; }
  let j = {};
  try { j = await r.json(); } catch(e){ j = {}; }
  if (!r.ok && !j.error) j.error = "HTTP " + r.status;
  return j;
}

function midTrunc(str, max){
  str = String(str == null ? "" : str);
  if (str.length <= max) return str;
  const tail = Math.max(10, Math.round((max - 1) * 0.62));
  return str.slice(0, max - 1 - tail) + "…" + str.slice(str.length - tail);
}
function busyBtn(el, text){
  if (el.dataset.was == null) el.dataset.was = el.textContent;
  el.textContent = text; el.disabled = true;
}
function freeBtn(el){
  if (el.dataset.was != null){ el.textContent = el.dataset.was; delete el.dataset.was; }
  el.disabled = false;
}
function setNote(el, text, cls){
  if (!text){ el.hidden = true; el.textContent = ""; return; }
  el.hidden = false; el.className = "note" + (cls ? " " + cls : ""); el.textContent = text;
}

/* -------- deep index */
function deepLine(d){
  if (!d) return "";
  if (d.enabled === false) return "Deep index · off";
  const st = d.state || "idle", qa = d.qa || 0;
  if (st === "error") return "Deep index · " + (d.error || "failed");
  if (st === "running"){
    const done = d.done || 0, total = d.total || 0;
    return "Deep index · " + done + "/" + total + (qa ? " · " + qa + " questions ready" : "");
  }
  if (st === "ready" || st === "done") return "Deep index · ready" + (qa ? " · " + qa + " questions" : "");
  return "Deep index · " + st;
}
function renderDeep(){
  const d = (S.status.index || {}).deep;
  put("deep", "hidden", !d);
  if (!d) return;
  const on = d.enabled !== false, running = on && d.state === "running";
  put("deep-text", "text", deepLine(d));
  put("deep-row", "class", "deep-row" + (d.state === "error" ? " bad" : ""));
  put("deep-bar", "hidden", !running);
  if (running) $("deep-fill").style.width =
    (d.total ? Math.round(100 * Math.min(1, (d.done || 0) / d.total)) : 0) + "%";
  if ($("deep-toggle").dataset.was == null) put("deep-toggle", "text", on ? "Turn off" : "Turn on");
  put("deep-run", "hidden", !on || running);
}
async function deepPost(body, btn){
  if (btn) busyBtn(btn, "…");
  const j = await api("/api/context/deep", "POST", body);
  if (btn) freeBtn(btn);
  if (j.index){ S.status.index = j.index; renderStatus(); }
}
$("deep-toggle").addEventListener("click", function(){
  const d = (S.status.index || {}).deep || {};
  deepPost({enabled: d.enabled === false}, this);
});
$("deep-run").addEventListener("click", function(){ deepPost({}, this); });

/* -------- files */
function renderContext(){
  const c = S.context || {}, files = c.files || [], own = c.own_dir !== false;
  const path = $("ctx-path");
  path.innerHTML = FOLDER_ICON + "<b>" + esc(midTrunc(c.dir || "—", 44)) + "</b>";
  path.title = c.dir || "";

  const list = $("flist");
  if (!files.length){
    list.innerHTML = '<div class="fempty">No files yet</div>';
  } else {
    list.innerHTML = files.map(function(f){
      const ext = String(f.kind || "").toLowerCase();
      const cls = SHEET[ext] ? " sheet" : (DOCK[ext] ? " doc" : "");
      let meta = "—", mcls = "fmeta";
      if (f.error){ meta = "Failed"; mcls = "fmeta err"; }
      else if (!f.indexed) meta = "Skipped";
      else if (f.tables) meta = f.tables + (f.tables === 1 ? " table" : " tables");
      else if (f.chunks) meta = f.chunks + (f.chunks === 1 ? " chunk" : " chunks");
      return '<div class="frow" data-name="' + esc(f.name) + '">' +
        '<span class="fkind' + cls + '">' + esc(ext || "?") + "</span>" +
        '<span class="fname" title="' + esc(f.name) + '">' + esc(f.name) + "</span>" +
        '<span class="' + mcls + '" title="' + esc(f.error || "") + '">' + esc(meta) + "</span>" +
        (own ? '<button class="frm" data-rm="' + esc(f.name) + '" title="Remove" aria-label="Remove ' + esc(f.name) + '">✕</button>' : "") +
        "</div>";
    }).join("");
  }
  const bad = files.filter(function(f){ return f.error; }).length;
  if (!own) setNote($("ctx-note"), "Outside presage's folder; remove files in Finder");
  else if (bad) setNote($("ctx-note"), bad + (bad === 1 ? " file failed to index" : " files failed to index"), "bad");
  else setNote($("ctx-note"), "");
}

/* ------------------------------------------------------------ hold queue */
/* A card that lands while you are mid-sentence pulls your eye at the worst moment, so new
   cards and promoted chips wait for the pause (or 4 s, whichever comes first). Partial
   redraws of a card already on screen still go through, and notes never wait. */
function holdIfSpeaking(m){
  if (!S.me_speaking) return false;
  // a newer status for a question already waiting replaces it in the queue rather than overtaking it
  if (m.type === "question"){
    const q = S.held.findIndex(function(x){ return x.type === "question" && x.id === m.id; });
    if (q >= 0){ S.held[q] = m; return true; }
  }
  // a redraw of a card on screen goes through; a Heard slot is only a placeholder, so its answer waits
  if (m.type === "answer" && S.answers.some(function(a){ return a.id === m.id && !a._heard; })) return false;
  if (m.type === "candidate" && m.status !== "ready") return false;
  // a question is held only when it would open a new slot; a status change on one goes straight through
  if (m.type === "question" && (m.status !== "heard" || S.answers.some(function(a){ return a.id === m.aid; }))) return false;
  const i = S.held.findIndex(function(x){ return x.type === m.type && x.id === m.id; });
  if (i >= 0) S.held[i] = m; else S.held.push(m);
  if (!S.heldTimer) S.heldTimer = setTimeout(flushHeld, HOLD_MAX_MS);
  renderHeld();
  return true;
}
function flushHeld(){
  if (S.heldTimer){ clearTimeout(S.heldTimer); S.heldTimer = null; }
  if (!S.held.length) return renderHeld();
  const items = S.held;
  S.held = [];
  for (const m of items) applyNow(m);
  renderHeld();
}
function renderHeld(){
  const n = S.held.length;
  put("held", "hidden", !n);
  if (n) put("held", "text", n + " held");
}

/* ------------------------------------------------------------- messages */
function apply(m){
  if (m.type === "candidate" && m.status === "expired" && S.held.length){
    S.held = S.held.filter(function(x){ return !(x.type === "candidate" && x.id === m.id); });
    renderHeld();
  }
  if ((m.type === "answer" && !isCheck(m) || m.type === "candidate" || m.type === "question") && holdIfSpeaking(m)) return;
  applyNow(m);
}
function applyNow(m){
  switch (m.type){
    case "hello": {
      if (typeof m.now === "number") S.offset = m.now - Date.now()/1000;
      if (m.settings) { S.settings = Object.assign(S.settings, m.settings); syncTune(); }
      S.modes = (m.modes && m.modes.length) ? m.modes : MODE_FALLBACK;
      S.notes = m.notes || null;
      S.notesSeen = true;
      S.scratch = m.scratch || [];
      S.scratchKeys = null;
      if (m.audio) S.audio = m.audio;
      if (m.llm) S.llm = m.llm;
      if (m.context) S.context = m.context;
      if (m.devices) S.devices = m.devices;
      if (m.status) S.status = Object.assign(S.status, m.status);
      S.lines = []; S.lineIx.clear(); S.alias.clear(); S.callT0 = null;
      for (const l of (m.transcript || [])){
        const key = S.lineIx.has(l.id) ? l.id + "~" + (++S.aliasSeq) : l.id;
        l._key = key;
        noteStart(l);
        S.lines.push(l); S.lineIx.set(key, l);
      }
      S.screen = m.screen || {};
      S.questions.clear(); S.qlines.clear();
      S.checks = (m.answers || []).filter(isCheck).slice(0, 5);
      S.answers = (m.answers || []).filter(function(a){ return !isCheck(a); }).slice(0, MAX_ANSWERS);
      for (const q of (m.questions || []).slice().reverse()){               // newest first on the wire
        S.questions.set(q.aid, q);
        if (q.line) S.qlines.set(q.line, q.aid);
        if (wantsSlot(q) && !S.answers.some(function(a){ return a.id === q.aid; }))
          S.answers.unshift({id:q.aid, _heard:true, question:q.text, who:q.who, ts:q.ts || now()});
      }
      S.answers.sort(function(x, y){ return (y.ts || 0) - (x.ts || 0); });
      if (S.answers.length > MAX_ANSWERS) S.answers.length = MAX_ANSWERS;
      S.cands = (m.candidates || []).slice();
      S.shown.clear();
      S.fb.clear();                                    // hello carries no verdicts; the record is the log
      S.sel = null;
      S.pending = null; setBusy(false);
      S.me_speaking = !!(m.status && m.status.me_speaking);
      if (S.heldTimer){ clearTimeout(S.heldTimer); S.heldTimer = null; }
      S.held = []; renderHeld();
      renderModes(); renderNotes(); renderChecks(false); renderScreen();
      renderStatus(); renderTranscript(); renderAnswers(); renderDeck(); renderDrawer();
      break;
    }
    case "transcript": onTranscript(m); break;
    case "question": onQuestion(m); break;
    case "answer": pushAnswer(m); break;
    case "candidate": {
      const i = S.cands.findIndex(function(c){ return c.id === m.id; });
      if (i >= 0) S.cands[i] = m; else S.cands.push(m);
      if (m.status === "expired") S.shown.delete(m.id);
      S.cands = S.cands.filter(function(c){ return c.status !== "expired"; });
      const cap = Math.max(1, Number(S.settings.max_warm) || 6);
      if (S.cands.length > cap) S.cands = S.cands.slice(S.cands.length - cap);
      renderDeck();
      break;
    }
    case "status": {
      if (typeof m.now === "number") S.offset = m.now - Date.now()/1000;
      if (m.quitting) return showGone();
      if (typeof m.me_speaking === "boolean"){
        S.me_speaking = m.me_speaking;
        if (!m.me_speaking) flushHeld();
      }
      S.status = Object.assign(S.status, m);
      // the drawer redraws only when its part changed: a redraw empties the key fields
      if (m.audio){ S.audio = m.audio; if (drawerOpen() && changed("audio", m.audio)) renderAudio(); }
      if (m.llm){ S.llm = m.llm; if (drawerOpen() && changed("llm", m.llm)) renderModel(); }
      if (m.context) S.context = Object.assign({}, S.context, m.context);
      renderStatus();
      break;
    }
    case "feedback": S.fb.set(m.id, m.verdict); renderAnswers(); renderChecks(false); break;
    case "notes":
      S.notes = m;
      if (S.tab !== "notes" && activeMode() !== "notes") S.notesSeen = false;
      renderNotes(); renderTop(viewList()[0] || null);
      break;
    case "scratch": S.scratch = m.items || []; renderScratch(); break;
    case "context": S.context = m; renderContext(); break;
    case "devices": {
      S.devices = m.inputs || [];
      if (m.output_device) S.outputDevice = m.output_device;
      renderAudio();
      break;
    }
    case "settings":
      S.settings = Object.assign(S.settings, m.values || {});
      syncTune(); renderModes(); renderNotes(); renderAnswers();
      break;
    case "cleared": doClear(); break;
  }
}

/* --------------------------------------------------------------- socket */
let ws = null, backoff = 500, sendQ = [];
function send(o){
  if (MOCK || GALLERY) return;
  const s = JSON.stringify(o);
  if (ws && ws.readyState === 1) ws.send(s); else sendQ.push(s);
}
function connect(){
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  // the query string rides along so the stub's replay can take ?at=; the real server ignores it
  try { ws = new WebSocket(proto + "//" + location.host + "/ws" + location.search); }
  catch(e){ return setTimeout(connect, backoff = Math.min(5000, backoff*1.6)); }
  ws.onopen = function(){
    backoff = 500; S.connected = true; renderConn();
    while (sendQ.length) ws.send(sendQ.shift());
  };
  ws.onmessage = function(ev){
    let m; try { m = JSON.parse(ev.data); } catch(e){ return; }
    apply(m);
  };
  ws.onclose = ws.onerror = function(){
    if (!S.connected && ws && ws.readyState === 1) return;
    S.connected = false; renderConn();
    if (ws){ ws.onopen = ws.onmessage = ws.onclose = ws.onerror = null; ws = null; }
    setTimeout(connect, backoff);
    backoff = Math.min(5000, Math.round(backoff*1.6));
  };

  function mockAskAnswer(text){
    const aid = "t" + Math.round(Date.now()/100);
    const q = {type:"question", id:"q" + aid.slice(1), aid:aid, text:text, who:"Me", source:"mic", line:null,

    setTimeout(function(){ apply(q); }, 120);
    setTimeout(function(){
      apply({type:"answer", id:aid, question:text, who:"Me",
        answer:"Nothing in the loaded files answers that directly. Try naming a file or a metric.",
        figure:null, citations:[], source:"manual", latency_ms:1180, in_files:false, ts:now()});
      apply(Object.assign({}, q, {status:"answered"}));
    }, 1180);
  }

  let timers = [];
  function run(){
    timers.forEach(function(h){ clearTimeout(h); clearInterval(h); });
    timers = [];
    const real = Date.now()/1000, skip = MOCK_AT;
    apply(hello(real - skip, real));
    for (const step of SCRIPT){
      if (step[0] <= skip){                       // already happened, land it aged
        if (typeof step[1] !== "string") apply(step[1](real - (skip - step[0])));
        continue;
      }
      timers.push(setTimeout(function(){
        const t = Date.now()/1000;
        if (typeof step[1] === "string"){
          const text = step[1].slice(5);
          if (document.activeElement !== $("ask")){
            $("ask").value = "";
            let i = 0;
            const iv = setInterval(function(){
              if (document.activeElement === $("ask")) return clearInterval(iv);
              $("ask").value = text.slice(0, ++i);
              if (i >= text.length){
                clearInterval(iv);
                $("ask").value = "";
                S.pending = {text:text};
                setBusy(true);
                renderAnswers();
              }
            }, 26);
            timers.push(iv);
          }
          return;
        }
        apply(step[1](t));
      }, (step[0] - skip)*1000));
    }
    // idle level jitter
    timers.push(setInterval(function(){
      apply(Object.assign({}, STATUS, {now:Date.now()/1000, levels:{mic: Math.random()*.55, system: Math.random()*.4}}));
    }, 700));
    timers.push(setTimeout(run, Math.max(5000, 62000 - skip*1000)));
  }
  function fakeApi(path, method, body){
    if (path === "/api/audio/devices") return {inputs:DEVICES, output_device:"MacBook Pro Speakers"};
    if (path === "/api/audio/start"){
      S.audio = Object.assign({}, S.audio, {state:"running", mic_state:"ok", mic_uid:(body && body.mic_uid) || null});

      return {audio:S.audio};
    }
    if (path === "/api/llm"){
      const l = Object.assign({}, S.llm);
      if (body && body.provider) l.provider = body.provider;
      if (body && body.models) l.models = body.models;
      if (body && body.api_key){ l.key_set = true; l.key_hint = "…" + body.api_key.slice(-4); }
      l.key_ok = true; l.key_message = "Key OK";

      l.decider.intent = Object.assign({}, l.decider.intent, {choice:body.intent,

    if (path === "/api/feedback" && body){
      setTimeout(function(){ apply({type:"feedback", id:body.id, verdict:body.verdict, ts:now()}); }, 30);
      return {ok:true, id:body.id, verdict:body.verdict, known:true};
    }
    return {cancelled:true};
  }

  return {run:run, show:mockShowAnswer, ask:mockAskAnswer, api:fakeApi, hello:hello, F:F};
})();
