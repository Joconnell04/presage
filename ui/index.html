<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>presage</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0b0d'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%237c8cff'/%3E%3C/svg%3E">
<script>
/* Theme before first paint. ?theme= wins for this load, then the saved choice, then dark. */
(function(){
  var q = new URLSearchParams(location.search).get("theme"), pref = "dark";
  try { pref = localStorage.getItem("presage.theme") || "dark"; } catch(e){}
  if (q === "light" || q === "dark" || q === "system") pref = q;
  var light = pref === "light" ||
    (pref === "system" && !!window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches);
  document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
  document.documentElement.setAttribute("data-pref", pref);
})();
</script>
<style>
/* tokens:begin  (docs/design/tokens.css is a copy of this block) */
:root{
  color-scheme:dark;
  /* surfaces, back to front */
  --bg:#0b0b0d;
  --surface-1:#111114;
  --surface-2:#16161a;
  --surface-3:#1e1e23;
  --surface-sel:#24242b;
  --border:#222228;
  --border-strong:#2e2e36;
  --divider:#1a1a1f;
  /* text, loud to quiet */
  --text-1:#f5f5f8;
  --text-2:#d2d2da;
  --text-3:#8d8d98;
  --text-4:#70707b;              /* 4.0:1 on --bg: tertiary, still readable at a glance */
  /* accent: Me, focus, selection, the live dot */
  --accent:#7c8cff;
  --accent-text:#a9b3ff;
  --accent-soft:rgba(124,140,255,.14);
  --accent-line:rgba(124,140,255,.42);
  /* state: colour only ever means one of these */
  --ok:#5ee0b1;      --ok-soft:rgba(94,224,177,.13);
  --warm:#f0b35a;    --warm-soft:rgba(240,179,90,.13);
  --bad:#f4676d;     --bad-soft:rgba(244,103,109,.14);
  --web:#5ab6ff;     --web-soft:rgba(90,182,255,.14);
  --derived:#ff9151; --derived-soft:rgba(255,145,81,.14);
  --glow:55%;
  /* controls */
  --seg-bg:#111114;
  --seg-on:#26262e;
  --seg-on-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  --scroll-thumb:#2a2a31;
  --scrim:rgba(4,4,6,.56);
  /* elevation */
  --e1:inset 0 1px 0 rgba(255,255,255,.025),0 18px 40px -24px rgba(0,0,0,.9);
  --e2:0 20px 56px -12px rgba(0,0,0,.8),0 0 0 1px rgba(0,0,0,.45);
  --e3:-28px 0 64px -30px rgba(0,0,0,.9);
  /* type */
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --fs-xs:11px; --fs-cap:10.5px; --fs-meta:11.5px; --fs-sm:12px; --fs-ui:12.5px; --fs-body:13.5px; --fs-row:14.5px;
  --fs-detail:16px; --fs-lede:24px; --fs-say:32px; --fs-figure:62px;
  /* space, 4 px grid */
  --s1:2px; --s2:4px; --s3:6px; --s4:8px; --s5:10px; --s6:12px; --s7:16px; --s8:20px; --s9:24px; --s10:32px;
  /* radii */
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:12px; --r-xl:14px;
  /* sizes */
  --h-bar:48px; --h-row:34px; --h-ctl:28px; --h-kbd:20px; --top-min:300px;
  --max-w:1760px;
  --gutter:max(16px, calc((100vw - var(--max-w)) / 2));
  /* motion */
  --ease:cubic-bezier(.2,.7,.3,1);
  --d1:90ms; --d2:160ms; --d3:220ms; --d4:620ms;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f4f4f6;
  --surface-1:#ffffff;
  --surface-2:#ffffff;
  --surface-3:#ececf0;
  --surface-sel:#e6e8f6;
  --border:#e1e1e7;
  --border-strong:#d0d0d9;
  --divider:#ebebef;
  --text-1:#0f0f12;
  --text-2:#2a2a30;
  --text-3:#686873;
  --text-4:#7e7e88;
  --accent:#4f5fe8;
  --accent-text:#3d4cd4;
  --accent-soft:rgba(79,95,232,.10);
  --accent-line:rgba(79,95,232,.40);
  --ok:#0a7c59;      --ok-soft:rgba(10,124,89,.10);      /* state colours are text too (tags, scratch values): */
  --warm:#946009;    --warm-soft:rgba(148,96,9,.11);     /* each clears 4.3:1 on the selected row */
  --bad:#c42b41;     --bad-soft:rgba(196,43,65,.09);
  --web:#15679f;     --web-soft:rgba(21,103,159,.09);
  --derived:#b04a0c; --derived-soft:rgba(176,74,12,.10);
  --glow:0%;
  --seg-bg:#ebebef;
  --seg-on:#ffffff;
  --seg-on-shadow:0 1px 2px rgba(15,15,30,.12),0 0 0 1px rgba(15,15,30,.06);
  --scroll-thumb:#cfcfd8;
  --scrim:rgba(20,20,28,.20);
  --e1:0 1px 2px rgba(15,15,30,.05),0 10px 28px -18px rgba(15,15,30,.22);
  --e2:0 18px 48px -14px rgba(15,15,30,.26),0 0 0 1px rgba(15,15,30,.06);
  --e3:-24px 0 56px -28px rgba(15,15,30,.28);
}
/* tokens:end */

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text-2);font-family:var(--font);font-size:var(--fs-body);line-height:1.45;
  -webkit-font-smoothing:antialiased;
  display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);
  height:100dvh;overflow:hidden;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:inherit}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none !important}   /* a display rule would otherwise beat the attribute */
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent-line);outline-offset:1px}
.spacer{flex:1 1 auto}
.cap{font-size:var(--fs-cap);font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--text-4);white-space:nowrap}
.meta{font-size:var(--fs-meta);color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.meta.dim{color:var(--text-4)}

/* ---------- scrollbars ---------- */
.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--scroll-thumb) transparent}
.scroll::-webkit-scrollbar{width:8px;height:8px}
.scroll::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.scroll::-webkit-scrollbar-track{background:transparent}

/* ---------- atoms: dot, keycap, tag, provenance ---------- */
.dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--text-4)}
.dot.ok{background:var(--ok);box-shadow:0 0 7px color-mix(in srgb,var(--ok) var(--glow),transparent)}
.dot.warm{background:var(--warm);box-shadow:0 0 7px color-mix(in srgb,var(--warm) var(--glow),transparent)}
.dot.bad{background:var(--bad);box-shadow:0 0 7px color-mix(in srgb,var(--bad) var(--glow),transparent)}
.dot.web{background:var(--web)}
.dot.derived{background:var(--derived)}
.dot.accent{background:var(--accent);box-shadow:0 0 7px color-mix(in srgb,var(--accent) var(--glow),transparent)}
.dot.pulse{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.kbd{
  display:inline-flex;align-items:center;justify-content:center;gap:2px;min-width:var(--h-kbd);height:var(--h-kbd);
  padding:0 5px;border-radius:5px;background:var(--surface-3);
  box-shadow:inset 0 -1px 0 var(--border-strong),0 0 0 1px var(--border);
  font-family:var(--font);font-size:var(--fs-xs);font-weight:550;line-height:1;color:var(--text-3);flex:none;white-space:nowrap;
}
button.kbd{cursor:pointer;transition:color var(--d1),background var(--d1)}
button.kbd:hover{color:var(--text-1);background:var(--surface-sel)}

.tag{
  display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:5px;flex:none;
  font-size:10px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;
}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warm{background:var(--warm-soft);color:var(--warm)}
.tag.line{box-shadow:inset 0 0 0 1px var(--border-strong);color:var(--text-3)}
.tag.used{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ok) 38%,transparent);color:var(--ok)}
.tag.wrong{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bad) 42%,transparent);color:var(--bad)}

.prov{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);font-weight:550;color:var(--text-2);white-space:nowrap;flex:none}

/* ---------- controls ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;height:var(--h-ctl);padding:0 11px;flex:none;
  border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface-1);
  color:var(--text-2);font-size:var(--fs-ui);font-weight:500;white-space:nowrap;
  transition:background var(--d1),border-color var(--d1),color var(--d1);
}
.btn:hover{background:var(--surface-3);border-color:var(--border-strong);color:var(--text-1)}
.btn:active{background:var(--surface-sel)}
.btn.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-text)}
.btn.sq{width:var(--h-ctl);padding:0}
.btn.wide{width:100%}
.btn.big{height:32px;font-size:13px;font-weight:550}
.btn.primary{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-text)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.btn.sure{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 40%,transparent);color:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{font-size:var(--fs-meta);color:var(--text-3);text-decoration:underline;text-underline-offset:3px;
  text-decoration-color:var(--border-strong)}
.link:hover{color:var(--accent-text)}
.icon-btn{width:26px;height:26px;border-radius:var(--r-sm);color:var(--text-3);display:inline-flex;
  align-items:center;justify-content:center;font-size:var(--fs-sm)}
.icon-btn:hover{background:var(--surface-3);color:var(--text-1)}

.seg{display:inline-flex;padding:2px;gap:2px;border:1px solid var(--border);border-radius:var(--r-md);
  background:var(--seg-bg);flex:none}
.seg button{height:22px;padding:0 10px;border-radius:var(--r-sm);font-size:var(--fs-ui);font-weight:500;
  color:var(--text-3);white-space:nowrap;transition:color var(--d1),background var(--d1);
  display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button:hover{color:var(--text-1)}
.seg button.on{background:var(--seg-on);color:var(--text-1);box-shadow:var(--seg-on-shadow)}
.seg button[disabled]{opacity:.4;cursor:default;color:var(--text-3)}
.seg.fill{display:flex;width:100%}
.seg.fill button{flex:1;height:26px}

/* ---------- top bar ---------- */
header{
  grid-row:1;display:flex;align-items:center;gap:10px;min-width:0;
  height:var(--h-bar);padding:0 var(--gutter);border-bottom:1px solid var(--border);
}
.brand{display:inline-flex;align-items:center;gap:8px;margin-right:6px;flex:none;
  font-size:14px;font-weight:650;letter-spacing:-.01em;color:var(--text-1)}
.brand i{width:7px;height:7px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 10px color-mix(in srgb,var(--accent) 75%,transparent)}
.modes button{padding:0 9px}
.mode-sel{display:none}
.sgroup{display:inline-flex;align-items:stretch;height:var(--h-ctl);flex:none;border:1px solid var(--border);
  border-radius:var(--r-md);background:var(--surface-1);overflow:hidden}
.sitem{position:relative;display:inline-flex;align-items:center;gap:6px;padding:0 10px;
  font-size:var(--fs-meta);color:var(--text-3);white-space:nowrap}
.sitem+.sitem{border-left:1px solid var(--divider)}
.sitem b{font-weight:550;color:var(--text-2)}
button.sitem:hover{background:var(--surface-3)}
#t-screen{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.sitem:hover b{color:var(--text-1)}
.meter{width:28px;height:3px;border-radius:2px;background:var(--surface-3);overflow:hidden;flex:none}
.meter i{display:block;width:100%;height:100%;background:var(--accent);transform-origin:left;transform:scaleX(0);
  transition:transform .1s linear}
.meter.sys i{background:var(--text-3)}
.fbar{position:absolute;left:10px;right:10px;bottom:3px;height:2px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.fbar i{display:block;width:100%;height:100%;background:var(--accent);transform-origin:left;transform:scaleX(0);
  transition:transform .25s ease}
.conn{display:inline-flex;align-items:center;gap:6px;margin-left:4px;font-size:var(--fs-meta);color:var(--text-3);
  white-space:nowrap;flex:none}
.conn.bad{color:var(--bad)}

/* ---------- tune popover ---------- */
.pop-wrap{position:relative;flex:none}
.pop{
  position:absolute;top:36px;right:0;width:264px;z-index:40;padding:4px;
  background:var(--surface-2);border:1px solid var(--border-strong);border-radius:var(--r-lg);box-shadow:var(--e2);
  display:none;
}
.pop.open{display:block;animation:pop var(--d2) var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.tune-row{padding:8px 9px 10px;border-radius:var(--r-md)}
.tune-row+.tune-row{border-top:1px solid var(--divider)}
.tune-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.tune-head span{font-size:var(--fs-sm);color:var(--text-2)}
.tune-head b{font-size:var(--fs-sm);font-weight:600;color:var(--text-1)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;background:transparent;display:block}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--accent) 0 var(--p,0%),var(--surface-3) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
  background:var(--text-1);margin-top:-4.5px;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:var(--surface-3)}
input[type=range]::-moz-range-progress{height:3px;border-radius:3px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--text-1)}

/* ---------- not-listening banner ---------- */
.banner{grid-row:2;display:flex;align-items:center;gap:9px;margin:10px var(--gutter) 0;height:34px;padding:0 5px 0 12px;
  border:1px solid color-mix(in srgb,var(--bad) 24%,var(--border));border-radius:var(--r-md);
  background:color-mix(in srgb,var(--bad) 5%,var(--surface-1));font-size:var(--fs-ui);color:var(--text-2)}
.banner .btn{height:24px;padding:0 11px;font-size:var(--fs-sm)}

/* ---------- layout ---------- */
main{
  grid-row:3;display:grid;grid-template-columns:minmax(0,1fr) clamp(360px,31vw,500px);
  gap:16px;padding:14px var(--gutter) 0;min-height:0;
}
.col{display:flex;flex-direction:column;min-height:0;min-width:0}
.head{display:flex;align-items:center;gap:8px;height:22px;margin-bottom:8px;padding:0 2px;flex:none}
.held{height:18px;padding:0 6px}
.panel{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r-lg)}
.phead{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px 0 14px;flex:none;
  border-bottom:1px solid var(--divider)}

/* ---------- top card: figure, say-line, basis; detail only on More ---------- */
.top{
  position:relative;flex:none;display:flex;flex-direction:column;min-height:var(--top-min);
  padding:18px 22px 16px;border:1px solid var(--border-strong);border-radius:var(--r-xl);
  background:var(--surface-2);box-shadow:var(--e1);cursor:pointer;
}
.top.empty{cursor:default;align-items:center;justify-content:center;gap:10px;background:transparent;
  border-style:dashed;border-color:var(--border);box-shadow:none;color:var(--text-4);font-size:var(--fs-body)}
.top.pending,.top.static{cursor:default}
.top.compact{min-height:0}
.top.miss{border-color:color-mix(in srgb,var(--bad) 34%,var(--border))}
.q{font-size:13px;line-height:1.4;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .q{margin-bottom:12px}
.top.open .q{white-space:normal}
.fig{font-family:var(--font-display);font-size:var(--fs-figure);font-weight:700;line-height:1;letter-spacing:-.034em;
  color:var(--text-1);font-variant-numeric:tabular-nums;margin-bottom:12px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:2px}
.fig.long{font-size:calc(var(--fs-figure) * .78)}
.fig.xlong{font-size:calc(var(--fs-figure) * .58)}
.top.unver .fig{color:var(--text-4);text-decoration:line-through;text-decoration-thickness:3px;
  text-decoration-color:color-mix(in srgb,var(--bad) 70%,transparent)}
.say{font-family:var(--font-display);font-size:var(--fs-say);font-weight:600;line-height:1.18;letter-spacing:-.022em;
  color:var(--text-1);text-wrap:balance}
.lede{font-size:var(--fs-lede);font-weight:550;line-height:1.3;letter-spacing:-.014em;color:var(--text-1);text-wrap:pretty}
/* a say-line is 4 to 8 words; one that runs longer stops at two lines, an answer at three, and More shows all */
.top .say,.top .lede{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.top .say{-webkit-line-clamp:2}
.top .lede{-webkit-line-clamp:3}
.top.open .say,.top.open .lede{-webkit-line-clamp:unset}
.top.miss .say,.top.miss .lede{color:var(--text-3)}
.work{margin-top:12px;padding-left:10px;border-left:2px solid color-mix(in srgb,var(--derived) 42%,transparent);
  font-family:var(--mono);font-size:var(--fs-ui);line-height:1.45;color:var(--text-3);overflow-wrap:anywhere}
.detail{margin-top:14px;padding-top:12px;border-top:1px solid var(--divider);
  font-size:var(--fs-detail);line-height:1.5;color:var(--text-2)}
.basis{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:16px}
.cite{display:inline-flex;align-items:center;max-width:100%;height:24px;padding:0 9px;
  border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface-1);
  font-size:var(--fs-sm);color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cite b{font-weight:550;color:var(--text-2)}
.cite .sep{margin:0 5px;color:var(--text-4)}
a.cite{text-decoration:none;border-color:color-mix(in srgb,var(--web) 30%,var(--border))}
a.cite b{color:var(--web);font-weight:500}
a.cite i{font-style:normal;margin-left:5px;color:var(--text-4);font-size:var(--fs-cap)}
a.cite:hover{border-color:color-mix(in srgb,var(--web) 60%,var(--border))}
.status{display:flex;align-items:center;gap:10px;margin-top:12px;min-height:20px;flex-wrap:wrap}
.top>.status{margin-top:auto;padding-top:14px}          /* pinned to the card bottom, citations or not */
.top>.basis+.status{margin-top:12px;padding-top:0}
.shimmer{height:30px;border-radius:var(--r-md);margin-top:6px;
  background:linear-gradient(90deg,var(--surface-3),var(--surface-sel),var(--surface-3));background-size:220% 100%;
  animation:sh 1.15s linear infinite}
.shimmer.w1{width:30%;height:52px;margin:0 0 14px}
.shimmer.w2{width:64%}
.lede.asked{color:var(--text-2)}
@keyframes sh{0%{background-position:120% 0}100%{background-position:-120% 0}}
@keyframes arrive{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes swap{0%{outline:2px solid color-mix(in srgb,var(--web) 65%,transparent);outline-offset:-1px;transform:translateY(-3px)}
  100%{outline:2px solid transparent;outline-offset:-1px;transform:none}}
.top.arrive{animation:arrive var(--d3) var(--ease)}
.top.swap{animation:swap var(--d4) var(--ease)}

.top.writing .lede{color:var(--text-3)}
.top.waiting .say,.top.waiting .lede,.top.noans .say,.top.noans .lede{color:var(--text-3)}
.who-me{font-size:var(--fs-meta);font-weight:600;color:var(--accent-text)}
.item.heard .rs{color:var(--text-3)}
.tt{position:relative}
.qmark{position:absolute;left:-9px;top:6px;width:5px;height:5px;border-radius:50%;background:var(--text-4)}   /* in the gutter, left of the stamp */
.qmark.ok{background:var(--ok)}
.qmark.warm{background:var(--warm)}
.top.writing .fig{color:var(--text-2)}

/* ---------- checks: a spoken figure the files contradict, a slide the model has moved past ---------- */
.flag-wrap{position:relative;min-width:0;display:flex}
.flag{display:inline-flex;align-items:center;gap:7px;height:22px;max-width:460px;min-width:0;padding:0 9px;
  border-radius:var(--r-sm);font-size:var(--fs-sm);color:var(--text-2);white-space:nowrap;
  border:1px solid color-mix(in srgb,var(--bad) 30%,var(--border));background:color-mix(in srgb,var(--bad) 7%,var(--surface-1))}
.flag.drift{border-color:color-mix(in srgb,var(--warm) 32%,var(--border));background:color-mix(in srgb,var(--warm) 7%,var(--surface-1))}
.flag:hover{color:var(--text-1)}
.flag .fq{min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--text-3)}
.flag .fa{color:var(--text-4)}
.flag .ff{flex:none;font-weight:650;color:var(--text-1);font-variant-numeric:tabular-nums}
.flag .more{flex:none;font-size:var(--fs-xs);color:var(--text-4)}
.flag.arrive{animation:flagin var(--d3) var(--ease)}
@keyframes flagin{from{opacity:0;transform:translateX(6px)}to{opacity:1;transform:none}}
.flagpop{top:30px;width:420px;max-height:60vh;padding:6px}
.chk{padding:10px 10px 11px;border-radius:var(--r-md)}
.chk+.chk{border-top:1px solid var(--divider)}
.chk-head{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.chk-say{font-size:17px;font-weight:600;line-height:1.3;color:var(--text-1)}
.chk-line{margin-top:4px;font-size:var(--fs-ui);color:var(--text-3)}
.chk-line b{font-weight:650;color:var(--text-1);font-variant-numeric:tabular-nums}
.chk .work{margin-top:8px;font-size:var(--fs-xs)}
.chk .basis{margin-top:0;padding-top:8px}
.chk .status{margin-top:9px}

/* ---------- older answers: compact rows ---------- */
.rows{flex:1;min-height:0;margin-top:10px;margin-right:-8px;padding-right:8px;padding-bottom:18px;
  -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 22px),transparent);
  mask-image:linear-gradient(180deg,#000 calc(100% - 22px),transparent)}
.item{border-radius:var(--r-md)}
.item+.item{margin-top:1px}
.item.open{background:var(--surface-1);box-shadow:inset 0 0 0 1px var(--border)}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) auto 58px;align-items:center;column-gap:14px;
  height:var(--h-row);padding:0 8px 0 12px;border-radius:var(--r-md);cursor:pointer}
.row:hover{background:var(--surface-1)}
.item.sel>.row{background:var(--surface-sel)}
.rf{font-size:var(--fs-row);font-weight:650;letter-spacing:-.01em;color:var(--text-1);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.rf.none{color:var(--text-4);font-weight:400}
.item.unver .rf{color:var(--text-4);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--bad) 70%,transparent)}
.rs{font-size:var(--fs-body);color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.miss .rs{color:var(--text-3)}
.rp{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.rp .tag{height:18px;padding:0 6px;font-size:9.5px}
.rend{display:flex;align-items:center;justify-content:flex-end;gap:4px}
.age{font-size:var(--fs-meta);color:var(--text-4);font-variant-numeric:tabular-nums;white-space:nowrap}
.racts{display:none;gap:4px}
.row:hover .racts,.item.sel .racts{display:flex}
.row:hover .rend .age,.item.sel .rend .age{display:none}
.rdetail{padding:2px 12px 12px 122px}
.rdetail .ans{margin-top:4px;font-size:var(--fs-row);line-height:1.45;color:var(--text-2)}
.rdetail .work{margin-top:8px;font-size:var(--fs-sm)}
.rdetail .basis{margin-top:0;padding-top:10px}
.rdetail .status{margin-top:10px}

/* ---------- on deck ---------- */
.deck{flex:none;display:flex;align-items:center;gap:10px;min-height:50px;padding:10px 0 10px 2px;margin-top:4px;
  border-top:1px solid var(--divider);min-width:0}
.deck.top-pos{border-top:0;border-bottom:1px solid var(--divider);margin:0 0 10px;padding-top:0}
.deck.quiet{opacity:.4;pointer-events:none}
.chips{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);
  mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;flex:none;min-width:0;max-width:300px;height:28px;padding:0 10px;
  border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface-1);font-size:var(--fs-ui);
  color:var(--text-2);white-space:nowrap;transition:background var(--d1),border-color var(--d1),opacity var(--d2)}
.chip:hover{background:var(--surface-3);border-color:var(--border-strong)}
.chip.ready{border-color:color-mix(in srgb,var(--ok) 28%,var(--border))}
.chip.ready:hover{border-color:color-mix(in srgb,var(--ok) 55%,var(--border))}
/* one label per chip, clipped inside it: the guessed question when ready, the first topic while warming */
.chip .lab{min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--text-2)}
.chip .cfig{flex:none;font-weight:650;color:var(--text-1);font-variant-numeric:tabular-nums;max-width:110px;
  overflow:hidden;text-overflow:ellipsis}
.chip .more{flex:none;font-size:var(--fs-xs);color:var(--text-4)}
.chip.warming,.chip.idle,.chip.shown{cursor:default}
.chip.warming{max-width:220px}
.chip.warming:hover,.chip.idle:hover{background:var(--surface-1);border-color:var(--border)}
.chip.warming .lab,.chip.idle .lab{color:var(--text-3)}
.chip.shown{border-color:var(--accent-line)}
.chip.arrive{animation:chipin var(--d3) var(--ease)}
@keyframes chipin{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* ---------- right rail: scratch, transcript, notes ---------- */
.rail{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0;padding-top:30px}
main.notes-mode .rail{padding-top:0}          /* the notes panel, not the Answers label, tops the column */
.scratch{flex:none}
/* fixed first columns so values line up down the list; the output wraps rather than lose its number */
.srow{display:grid;grid-template-columns:minmax(0,28%) 58px 12px minmax(0,1fr);align-items:baseline;column-gap:8px;
  min-height:30px;padding:7px 14px;font-size:var(--fs-ui);line-height:1.35}
.srow+.srow{border-top:1px solid var(--divider)}
.srow{cursor:pointer}
.srow .sdet{grid-column:1 / -1;padding:4px 0 6px;display:flex;flex-direction:column;gap:2px}
.srow .sline{font-size:var(--fs-sm,12px);color:var(--text-2);line-height:1.35;white-space:normal}
.srow .sline.dim{color:var(--text-3)}
.slab{color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sval{color:var(--derived);font-weight:600;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.sarr{color:var(--text-4);text-align:center}
.srow.calc .slab{grid-column:1 / 4}                   /* a calc row moved no lever: its question takes the value's room */
.srow.calc .sval,.srow.calc .sarr{display:none}
.sout{color:var(--text-1);font-weight:550;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.srow.fresh{animation:fresh 1.8s ease-out}
@keyframes fresh{from{background:var(--derived-soft)}to{background:transparent}}
.scratch .srow:last-child{border-radius:0 0 var(--r-lg) var(--r-lg)}
.tpanel{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.tabs button{height:22px;padding:0 9px;font-size:var(--fs-sm)}
.tabdot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none}
.tlines{flex:1;min-height:0;padding:8px 4px 12px 12px;display:flex;flex-direction:column;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 18px);mask-image:linear-gradient(180deg,transparent,#000 18px)}
#tinner{margin-top:auto}
.tl{display:grid;grid-template-columns:34px 50px minmax(0,1fr);column-gap:8px;padding:3px 6px 3px 0;align-items:baseline}
.tl+.tl{margin-top:1px}
.tt{font-size:var(--fs-xs);color:var(--text-4);font-variant-numeric:tabular-nums}
.who{font-size:var(--fs-meta);font-weight:600;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who.mic{color:var(--accent-text)}
.tx{font-size:var(--fs-body);line-height:1.45;color:var(--text-2);overflow-wrap:anywhere}
.tl.mic .tx{color:var(--text-1)}
.tl.interim .tx{color:var(--text-3)}
.uns{color:var(--text-4);font-style:italic}
/* the transcriber's words were repaired (E46): the line reads as corrected, the original is one hover away */
.tx.fixed{text-decoration:underline dotted color-mix(in srgb,var(--text-4) 65%,transparent);text-underline-offset:4px;
  text-decoration-thickness:1px;cursor:help}
.latest{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;z-index:5;display:none;align-items:center;gap:6px;
  height:26px;padding:0 12px;border-radius:13px;background:var(--surface-3);border:1px solid var(--border-strong);
  color:var(--text-2);font-size:var(--fs-meta);box-shadow:var(--e2)}
.latest.show{display:inline-flex}
.npanel{flex:1;min-height:0;padding:12px 14px 14px}
.nsec+.nsec{margin-top:16px}
.nsec h4{margin-bottom:7px}
.nsec ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.nsec li{position:relative;padding-left:13px;font-size:var(--fs-ui);line-height:1.4;color:var(--text-2)}
.nsec li::before{content:"";position:absolute;left:2px;top:7px;width:4px;height:4px;border-radius:50%;background:var(--text-4)}
.nsec.act li::before{background:var(--warm)}
.nsec.open li::before{background:var(--accent)}
.nsec .none{font-size:var(--fs-sm);color:var(--text-4)}
.notes-main{flex:none;margin-bottom:12px;max-height:48vh;display:flex;flex-direction:column}
.notes-main .ngrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding:14px 16px 16px;overflow-y:auto}
.notes-main .nsec+.nsec{margin-top:0}
.notes-main .nsec li{font-size:var(--fs-body)}

/* ---------- footer: ask + action bar ---------- */
footer{grid-row:4;display:flex;align-items:center;gap:16px;height:60px;padding:0 var(--gutter);
  padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--border);margin-top:14px}
.ask{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:38px;padding:0 8px 0 12px;
  background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r-md);
  transition:border-color var(--d1),box-shadow var(--d1)}
.ask:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.ask .glass{flex:none;color:var(--text-4)}
#ask{flex:1;min-width:0;height:100%;background:none;border:0;outline:none;font-size:var(--fs-row);color:var(--text-1)}
#ask::placeholder{color:var(--text-4)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--surface-3);border-top-color:var(--accent);
  animation:spin .7s linear infinite;flex:none;display:none}
.ask.busy .spin{display:block}
.ask.busy .kbd{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.hints{display:flex;align-items:center;gap:2px;flex:none}
.hint{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 8px;border-radius:var(--r-sm);
  font-size:var(--fs-sm);color:var(--text-3);white-space:nowrap}
button.hint:hover{background:var(--surface-1);color:var(--text-1)}
button.hint:hover .kbd{color:var(--text-2)}

/* ---------- settings drawer ---------- */
.scrim{position:fixed;inset:0;z-index:55;background:var(--scrim);backdrop-filter:blur(1.5px);
  opacity:0;pointer-events:none;transition:opacity var(--d2) ease}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100vw;z-index:60;display:flex;flex-direction:column;
  background:var(--bg);border-left:1px solid var(--border-strong);box-shadow:var(--e3);
  transform:translateX(103%);transition:transform .19s var(--ease)}
.drawer.open{transform:none}
.dhead{display:flex;align-items:center;gap:10px;height:var(--h-bar);padding:0 12px 0 16px;flex:none;
  border-bottom:1px solid var(--border)}
.dhead h2{font-size:var(--fs-body);font-weight:650;letter-spacing:-.01em;color:var(--text-1)}
.dbody{flex:1;min-height:0;padding-bottom:20px}
.dsec{padding:14px 16px;border-bottom:1px solid var(--divider)}
.dsec:last-child{border-bottom:0}
.dsec h3{margin-bottom:10px}
.path{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--border);
  border-radius:var(--r-md);background:var(--surface-1);font-size:var(--fs-sm);color:var(--text-3);white-space:nowrap;overflow:hidden}
.path b{font-weight:500;color:var(--text-2)}
.path svg{flex:none;color:var(--text-4)}
.btnrow{display:flex;gap:6px;margin-top:8px}
.btnrow .btn{flex:1 1 auto}
.deep{margin-top:8px}
.deep-row{display:flex;align-items:center;gap:10px;font-size:var(--fs-meta);color:var(--text-3)}
.deep-row.bad{color:var(--bad)}
.bar{height:3px;margin-top:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s ease}
.flist{margin-top:10px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface-1);max-height:252px}
.frow{display:flex;align-items:center;gap:9px;height:32px;padding:0 8px 0 10px}
.frow+.frow{border-top:1px solid var(--divider)}
.fkind{flex:none;min-width:32px;height:17px;padding:0 4px;border-radius:var(--r-xs);background:var(--surface-3);
  color:var(--text-3);font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center}
.fkind.sheet{background:var(--ok-soft);color:var(--ok)}
.fkind.doc{background:var(--accent-soft);color:var(--accent-text)}
.fname{flex:1;min-width:0;font-size:var(--fs-ui);color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmeta{font-size:var(--fs-xs);color:var(--text-4);white-space:nowrap;flex:none}
.fmeta.err{color:var(--bad);max-width:150px;overflow:hidden;text-overflow:ellipsis}
.frm{flex:none;height:20px;min-width:20px;border-radius:5px;color:var(--text-4);font-size:var(--fs-xs);
  display:inline-flex;align-items:center;justify-content:center}
.frm:hover{background:var(--surface-3);color:var(--bad)}
.frm.sure{padding:0 7px;font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  background:var(--bad-soft);color:var(--bad)}
.fempty{padding:13px 10px;text-align:center;font-size:var(--fs-sm);color:var(--text-4)}
.fld{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.fld>span{flex:none;width:70px;font-size:var(--fs-sm);color:var(--text-3)}
.fld .ro{flex:1;min-width:0;font-size:var(--fs-ui);font-weight:500;color:var(--text-2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.dd,.txt{flex:1;min-width:0;height:30px;padding:0 9px;border:1px solid var(--border);border-radius:var(--r-md);
  background:var(--surface-1);color:var(--text-1);font-size:var(--fs-ui);outline:none;-webkit-appearance:none;appearance:none}
.dd{padding-right:26px;
  background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);
  background-position:calc(100% - 13px) 13px,calc(100% - 9px) 13px;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.dd:hover,.txt:hover{border-color:var(--border-strong)}
.dd:focus,.txt:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.txt{font-size:var(--fs-sm);color:var(--text-2)}
.txt::placeholder{color:var(--text-4)}
.note{font-size:var(--fs-meta);line-height:1.4;margin-top:7px;color:var(--text-4)}
.note.field{margin:-2px 0 7px 80px}
.note.warn{color:var(--warm)}
.note.ok{color:var(--ok)}
.note.bad{color:var(--bad)}
.note code,.loginline code{font-family:var(--mono);font-size:var(--fs-xs);color:var(--text-2);background:var(--surface-3);
  border-radius:var(--r-xs);padding:0 4px}
.stateline{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:var(--fs-sm);color:var(--text-3)}
.keyrow{display:flex;gap:6px}
.keyrow .txt{height:30px;font-size:var(--fs-ui);letter-spacing:.02em}
.rowend{display:flex;justify-content:flex-end;margin-top:2px}
.rowlab{margin:12px 0 6px}
.loginline{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;margin-top:8px;border-radius:var(--r-md);
  border:1px solid var(--border);background:var(--surface-1);font-size:var(--fs-ui);color:var(--text-3)}
.loginline b{font-weight:500;color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subsec{margin-top:14px;padding-top:12px;border-top:1px solid var(--divider)}
.subsec h4{margin-bottom:8px}
.quitsec{padding:12px 16px 14px}

/* ---------- quit overlay ---------- */
.gone{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;text-align:center;background:color-mix(in srgb,var(--bg) 94%,transparent)}
.gone.show{display:flex}
.gone b{font-size:17px;font-weight:600;color:var(--text-1)}
.gone span{font-size:var(--fs-ui);color:var(--text-3)}

/* ---------- design gallery (?gallery=1) ---------- */
body.gallerymode{display:block;height:auto;overflow:visible}
body.gallerymode main{display:block;padding:20px 24px 40px}
body.gallerymode main>.col,body.gallerymode main>.rail{display:none}
body.gallerymode footer{margin-top:0}
.gallery-sec{margin-bottom:34px}
.gallery-sec>h2{margin-bottom:12px}
.gallery-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.gallery-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.gallery-cell>.cap{display:block;margin:0 0 7px 2px}
.gallery-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.swatches{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.sw{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;background:var(--surface-1)}
.sw i{display:block;height:34px;border-bottom:1px solid var(--border)}
.sw span{display:block;padding:5px 8px 6px;font-size:var(--fs-xs);color:var(--text-2)}
.sw em{display:block;font-style:normal;font-family:var(--mono);font-size:10px;color:var(--text-4)}
.tscale{display:flex;flex-direction:column;gap:8px}
.tscale div{display:flex;align-items:baseline;gap:18px}
.tscale code{width:120px;flex:none;font-family:var(--mono);font-size:var(--fs-xs);color:var(--text-4)}
.gallery-list{max-width:900px}
.gallery-panel{max-width:460px}

/* ---------- narrow screens ---------- */
@media (max-width:1099px){
  header{height:auto;flex-wrap:wrap;padding:8px 12px;gap:8px 10px}
  .modes{display:none}
  .mode-sel{display:inline-flex;height:26px;padding:0 24px 0 9px;border:1px solid var(--border);border-radius:var(--r-md);
    background:var(--surface-1);color:var(--text-2);font-size:var(--fs-sm);-webkit-appearance:none;appearance:none}
  .sgroup{order:3;width:100%}
  .meter{display:none}
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1.7fr) minmax(0,1fr);gap:10px;padding:10px 12px 0}
  .rail{padding-top:0}
  .top{--top-min:0px;padding:14px 15px 13px}
  .fig{font-size:44px}
  .say{font-size:24px}
  .lede{font-size:19px}
  .row{grid-template-columns:70px minmax(0,1fr) auto auto}
  .rend .age{display:none}
  .rdetail{padding-left:12px}
  footer{height:auto;flex-wrap:wrap;gap:6px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));margin-top:10px}
  .ask{flex-basis:100%}
  .pop{position:fixed;top:auto;bottom:74px;left:12px;right:12px;width:auto}
  .drawer{width:100%;border-left:0}
  .notes-main .ngrid{grid-template-columns:minmax(0,1fr)}
  .banner{margin:8px 12px 0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms !important;animation-iteration-count:1 !important;transition-duration:1ms !important}
}
</style>
</head>
<body>

<header>
  <div class="brand"><i></i>presage</div>
  <div class="seg modes" id="modes" role="group" aria-label="Mode"></div>
  <select class="mode-sel" id="mode-sel" aria-label="Mode"></select>
  <span class="spacer"></span>
  <div class="sgroup">
    <span class="sitem" id="s-mic"><span class="dot" id="d-mic"></span>Mic<span class="meter"><i id="m-mic"></i></span></span>
    <span class="sitem" id="s-sys"><span class="dot" id="d-sys"></span>System<span class="meter sys"><i id="m-sys"></i></span></span>
    <span class="sitem" id="s-stt"><span class="dot" id="d-stt"></span><b id="t-stt">—</b></span>
    <span class="sitem" id="s-screen" hidden><span class="dot" id="d-screen"></span><b id="t-screen" class="num"></b></span>
    <button class="sitem" id="s-files"><b id="t-files" class="num">0 files</b><span class="fbar" id="files-bar" hidden><i id="files-fill"></i></span></button>
  </div>
  <div class="pop-wrap">
    <button class="btn" id="tune-btn" aria-expanded="false">Tune</button>
    <div class="pop" id="pop"></div>
  </div>
  <button class="btn" id="listen-top" title="Listening on/off  ⌘L">Pause</button>
  <button class="btn" id="clear-btn">Clear</button>
  <button class="btn sq" id="gear-btn" title="Settings  ⌘," aria-label="Settings" aria-expanded="false">
    <svg width="13.5" height="13.5" viewBox="0 0 16 16" aria-hidden="true">
      <path fill="currentColor" fill-rule="evenodd" d="M6.52 0.95 L9.48 0.95 L9.20 3.15 L11.05 4.04 L12.59 2.45 L14.43 4.76 L12.54 5.91 L13.00 7.91 L15.20 8.13 L14.54 11.01 L12.47 10.25 L11.19 11.85 L12.39 13.71 L9.73 14.99 L9.02 12.89 L6.98 12.89 L6.27 14.99 L3.61 13.71 L4.81 11.85 L3.53 10.25 L1.46 11.01 L0.80 8.13 L3.00 7.91 L3.46 5.91 L1.57 4.76 L3.41 2.45 L4.95 4.04 L6.80 3.15 Z M10.25 8.00 A2.25 2.25 0 1 0 5.75 8.00 A2.25 2.25 0 1 0 10.25 8.00 Z"/>
    </svg>
  </button>
  <span class="conn" id="conn"></span>
</header>

<div class="banner" id="banner" hidden>
  <span class="dot bad"></span><span id="banner-text">Not listening</span>
  <span class="spacer"></span>
  <button class="btn" id="banner-start">Start</button>
</div>

<main id="main">
  <section class="col" id="col-answers">
    <section class="panel notes-main" id="notes-main" hidden></section>
    <div class="head"><h2 class="cap">Answers</h2>
      <span class="tag warm held" id="held" title="Held until you stop speaking" hidden></span>
      <span class="spacer"></span>
      <div class="flag-wrap" id="flag-wrap">
        <button class="flag" id="flag" hidden aria-expanded="false"></button>
        <div class="pop flagpop scroll" id="flagpop"></div>
      </div></div>
    <article class="top empty" id="top"></article>
    <div class="rows scroll" id="rows"></div>
    <div class="deck" id="deck"><span class="cap">On deck</span><div class="chips" id="chips"></div></div>
  </section>

  <aside class="rail">
    <section class="panel scratch" id="scratch" hidden></section>
    <section class="panel tpanel">
      <div class="phead">
        <h2 class="cap" id="tcap">Transcript</h2>
        <div class="seg tabs" id="tabs" hidden>
          <button data-tab="transcript" class="on">Transcript</button><button
            data-tab="notes">Notes<i class="tabdot" id="ndot" hidden></i></button>
        </div>
        <span class="spacer"></span><span class="meta dim" id="tmeta"></span>
      </div>
      <div class="tlines scroll" id="tlines"><div id="tinner"></div></div>
      <div class="npanel scroll" id="npanel" hidden></div>
      <button class="latest" id="latest">↓ Latest</button>
    </section>
  </aside>
</main>

<footer>
  <div class="ask" id="askwrap">
    <svg class="glass" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="M10.5 10.5 14 14" stroke-linecap="round"/></svg>
    <input id="ask" type="text" placeholder="Ask" autocomplete="off" spellcheck="false">
    <span class="spin"></span>
    <span class="kbd">⌘K</span>
  </div>
  <div class="hints" id="hints"></div>
</footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Settings" inert>
  <div class="dhead">
    <h2>Settings</h2><span class="spacer"></span>
    <button class="icon-btn" id="drawer-close" aria-label="Close">✕</button>
  </div>
  <div class="dbody scroll">

    <section class="dsec">
      <h3 class="cap">Files</h3>
      <div class="path" id="ctx-path" title=""><b>—</b></div>
      <div class="deep" id="deep" hidden>
        <div class="deep-row" id="deep-row">
          <span id="deep-text"></span><span class="spacer"></span>
          <button class="link" id="deep-run" hidden>Rerun</button>
          <button class="link" id="deep-toggle">Turn off</button>
        </div>
        <div class="bar" id="deep-bar" hidden><i id="deep-fill"></i></div>
      </div>
      <div class="btnrow">
        <button class="btn" id="ctx-browse">Browse…</button>
        <button class="btn" id="ctx-reveal">Reveal</button>
        <button class="btn" id="ctx-reindex">Reindex</button>
      </div>
      <div class="flist scroll" id="flist"></div>
      <div class="note" id="ctx-note" hidden></div>
      <div class="btnrow"><button class="btn wide" id="ctx-add">Add files…</button></div>
    </section>

    <section class="dsec">
      <h3 class="cap">Audio</h3>
      <div class="fld"><span>Mic</span><select class="dd" id="mic-sel"></select></div>
      <div class="note field warn" id="mic-warn" hidden></div>
      <div class="fld"><span>Output</span><b class="ro" id="out-dev">—</b></div>
      <button class="btn big wide primary" id="listen-btn">Start listening</button>
      <div class="stateline"><span class="dot" id="audio-dot"></span><span id="audio-line">Stopped</span></div>
    </section>

    <section class="dsec">
      <h3 class="cap">Model</h3>
      <div class="seg fill" id="prov-seg">
        <button data-p="anthropic">Anthropic</button><button data-p="gemini">Gemini</button><button
          data-p="claude_code">Claude Code</button>
      </div>
      <div class="rowlab cap">Live answers</div>
      <div class="seg fill" id="live-seg">
        <button data-lv="auto">Auto</button><button data-lv="same">Same</button><button
          data-lv="anthropic">API key</button>
      </div>
      <div class="note" id="live-note"></div>
      <div class="rowlab cap" id="key-lab">Key</div>
      <div class="keyrow" id="keybox">
        <input class="txt" id="api-key" type="password" placeholder="API key" autocomplete="off" spellcheck="false">
        <button class="btn" id="key-save">Save</button>
      </div>
      <div class="loginline" id="cc-login" hidden><span class="dot" id="cc-dot"></span><b id="cc-text">Checking…</b></div>
      <div class="note" id="cc-hint" hidden></div>
      <div class="note" id="key-note" hidden></div>
      <div style="height:8px"></div>
      <div class="fld"><span>Answer</span><input class="txt" id="m-answer" spellcheck="false"></div>
      <div class="fld"><span>Hedge</span><input class="txt" id="m-hedge" spellcheck="false"></div>
      <div class="fld"><span>Classifier</span><input class="txt" id="m-classifier" spellcheck="false"></div>
      <div class="rowend"><button class="link" id="m-reset">Reset</button></div>
      <div class="subsec">
        <h4 class="cap">Decisions</h4>
        <div class="seg fill" id="dec-seg">
          <button data-dc="auto">Auto</button><button data-dc="jev">Jev</button><button
            data-dc="laya">Laya</button><button data-dc="haiku">Haiku</button>
        </div>
        <div class="keyrow" style="margin-top:8px">
          <input class="txt" id="jev-key" type="password" placeholder="Jev API key" autocomplete="off" spellcheck="false">
          <button class="btn" id="jev-save">Save</button>
        </div>
        <div class="loginline" id="dec-line"><span class="dot" id="dec-dot"></span><b id="dec-text">—</b></div>
        <div id="int-box" hidden>
          <div class="rowlab cap">Intent</div>
          <div class="seg fill" id="int-seg">
            <button data-it="auto">Auto</button><button data-it="local">Local</button><button
              data-it="jev">Jev</button><button data-it="off">Off</button>
          </div>
          <div class="loginline" id="int-line"><span class="dot" id="int-dot"></span><b id="int-text">—</b></div>
        </div>
      </div>
    </section>

    <section class="dsec">
      <h3 class="cap">Appearance</h3>
      <div class="seg fill" id="theme-seg">
        <button data-th="dark">Dark</button><button data-th="light">Light</button><button data-th="system">System</button>
      </div>
    </section>

    <section class="dsec quitsec">
      <button class="btn danger wide" id="quit-btn">Quit presage</button>
    </section>

  </div>
</aside>

<div class="gone" id="gone"><b>presage quit</b><span>Start it again with ./run.sh</span></div>

<script>
"use strict";
(function(){

const Q = new URLSearchParams(location.search);
const MOCK = Q.get("mock") === "1";
const GALLERY = Q.get("gallery") === "1";                        // component gallery for docs/design
const DECK_TOP = Q.get("deck") === "top";
const MOCK_AT = Math.max(0, Number(Q.get("at")) || 0);   // fast-forward the mock, seconds
const OPEN_SETTINGS = Q.get("settings") === "1";          // open the drawer on load (screenshots)

const $ = function(id){ return document.getElementById(id); };
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}

/* ------------------------------------------------------------------ state */
const S = {
  settings: {topic_threshold:.35, question_threshold:.5, prefetch_cooldown_s:8, max_warm:6, answer_ttl_s:90},
  status: {mic:false, system:false, stt:"—", index:{files:0,tables:0,chunks:0}, listening:false, levels:{mic:0,system:0}},
  lines: [],          // transcript, oldest first
  lineIx: new Map(),  // line key -> line object
  alias: new Map(),   // server id -> line key, when a server id got reused for a new utterance
  aliasSeq: 0,
  answers: [],        // newest first
  cands: [],          // on deck, insertion order
  shown: new Set(),   // chips clicked, waiting for their answer
  offset: 0,          // server clock - client clock, seconds
  callT0: null,       // earliest line start seen, for m:ss transcript stamps
  pending: null,      // {text}
  connected: false,
  audio: {state:"stopped", mic_state:"unknown", mic_device:null, mic_uid:null, output_device:null, error:null},
  llm: {provider:"anthropic", models:{}, defaults:{}, key_set:false, key_hint:"", key_ok:null},
  context: {dir:"", files:[], own_dir:true, files_count:0},
  devices: [],        // audio inputs
  modes: [],          // [{id,label,hint}] from the server
  notes: null,        // last notes frame
  notesSeen: true,    // false while a notes update waits behind the Transcript tab
  tab: "transcript",  // right rail: transcript | notes
  scratch: [],        // what-ifs run this call, oldest first
  scratchKeys: null,  // rows already on screen, so only new ones flash
  sel: null,          // answer id the keys act on; null means the top card
  checks: [],         // corrections and drift cards, newest first
  screen: {},         // what the presenter has on screen (GET /api/screen)
  questions: new Map(), // E68: answer id -> the latest question frame registered for it
  qlines: new Map(),  // E68: transcript line id -> that question's status, for the line's marker
  fb: new Map(),      // answer id -> verdict the server echoed
  me_speaking: false, // a mic utterance is open: hold cards until the pause
  held: [],           // answers and promotions waiting for that pause
  heldTimer: null,
  quit: false
};
const MODE_FALLBACK = [
  {id:"call",      label:"Call",      hint:"Answers from your files appear here."},
  {id:"sales",     label:"Sales",     hint:"Objection handling and talk tracks appear here."},
  {id:"interview", label:"Interview", hint:"Suggested answers to their questions appear here."},
  {id:"pitch",     label:"Pitch",     hint:"Answers and tough-question responses appear here."},
  {id:"notes",     label:"Notes",     hint:"Notes build as the call goes on."},
  {id:"quiet",     label:"Quiet",     hint:"Nothing automatic. Ask a question below."}
];
const MAX_ANSWERS = 14;
const HOLD_MAX_MS = 4000;      // never hold a card longer than this, however long the sentence
const MAX_LINES = 220;
const REUSED_ID_S = 20;        // a final line whose id comes back this much later is a new utterance

function now(){ return Date.now()/1000 + S.offset; }

/* Write-if-changed, so the 700 ms status frames touch the DOM only when something moved. */
const LAST = {};
function changed(k, obj){
  const j = JSON.stringify(obj);
  if (LAST["json:" + k] === j) return false;
  LAST["json:" + k] = j;
  return true;
}
function put(id, prop, v){
  const k = id + "\u0000" + prop;
  if (LAST[k] === v) return;
  LAST[k] = v;
  const el = $(id);
  if (!el) return;
  if (prop === "text") el.textContent = v;
  else if (prop === "class") el.className = v;
  else if (prop === "hidden") el.hidden = v;
  else el.setAttribute(prop, v);
}

/* ------------------------------------------------------------- formatting */
function fmtAge(ts){
  const d = Math.max(0, now() - ts);
  if (d < 1.5) return "now";
  if (d < 60)  return Math.round(d) + " s ago";
  if (d < 3600) return Math.round(d/60) + " min ago";
  return (d/3600).toFixed(1).replace(/\.0$/,"") + " h ago";
}
function fmtShort(ts){
  const d = Math.max(0, now() - ts);
  if (d < 1.5) return "now";
  if (d < 60)  return Math.round(d) + "s";
  if (d < 3600) return Math.round(d/60) + "m";
  return (d/3600).toFixed(1).replace(/\.0$/,"") + "h";
}
function fmtLatency(ms){
  if (ms == null) return "";
  return ms < 1000 ? Math.round(ms) + " ms" : (ms/1000).toFixed(1) + " s";
}
function fmtStamp(t){
  if (S.callT0 == null || t == null) return "0:00";
  const d = Math.max(0, t - S.callT0);
  const m = Math.floor(d/60), s = Math.floor(d%60);
  return m + ":" + (s<10 ? "0"+s : s);
}
function clamp01(v){ return Math.max(0, Math.min(1, Number(v) || 0)); }
/* A figure that is a bare number ("27835848.58") gets thousands separators and loses decimals it
   cannot show; anything with a unit or a symbol is the server's own wording and stays as sent. */
function fmtFigure(f){
  const s = String(f == null ? "" : f).trim();
  if (!/^-?\d+(\.\d+)?$/.test(s) || /^(19|20)\d\d$/.test(s)) return s;   // a year is not a quantity
  const n = Number(s);
  if (Math.abs(n) >= 1000) return n.toLocaleString("en-US", {maximumFractionDigits: 0});
  return Number.isInteger(n) ? s : String(Number(n.toPrecision(4)));       // 0.0085 stays 0.0085
}
function figClass(f){ const n = String(f).length; return n > 22 ? " xlong" : n > 14 ? " long" : ""; }

/* --------------------------------------------------------------- top bar */
const MIC_WORD = {ok:"ok", recovering:"recovering", silent:"silent", fallback:"fell back"};
function micDot(){
  const a = S.audio || {}, dev = a.mic_device ? " · " + a.mic_device : "";
  if (a.state === "starting") return ["warm", "Starting"];
  if (a.state === "error")    return ["bad", a.error || "Audio error"];
  if (a.state !== "running")  return ["bad", "Not listening"];
  switch (a.mic_state){
    case "ok":         return ["ok",   "Mic ok" + dev];
    case "recovering": return ["warm", "Mic recovering" + dev];
    case "fallback":   return ["bad",  "Mic fell back to " + (a.mic_device || "another device")];
    case "silent":     return ["bad",  "Mic silent: check Microphone permission"];
    default:           return [S.status && S.status.mic ? "ok" : "warm", "Mic" + dev];
  }
}
function sttName(s){
  const n = String(s || "—").split(":").pop();
  return n.charAt(0).toUpperCase() + n.slice(1);
}

function renderStatus(){
  const st = S.status, md = micDot(), lv = st.levels || {};
  put("d-mic", "class", "dot " + md[0]);
  put("s-mic", "title", md[1]);
  put("d-sys", "class", "dot " + (st.system ? "ok" : "bad"));
  put("s-sys", "title", st.system ? "Far side audio" : "No far side audio");
  $("m-mic").style.transform = "scaleX(" + clamp01(lv.mic).toFixed(2) + ")";
  $("m-sys").style.transform = "scaleX(" + clamp01(lv.system).toFixed(2) + ")";
  put("d-stt", "class", "dot " + (st.listening ? "ok" : "warm"));
  put("t-stt", "text", sttName(st.stt));
  put("s-stt", "title", String(st.stt || "") + (st.listening ? " · listening" : " · not listening"));
  const ix = st.index || {}, n = ix.files || 0, d = ix.deep;
  put("t-files", "text", n + (n === 1 ? " file" : " files"));
  const deepTxt = deepLine(d);
  put("s-files", "title", n + " files · " + (ix.tables||0) + " tables · " + (ix.chunks||0) + " chunks" +
      (deepTxt ? "\n" + deepTxt : ""));
  const run = !!d && d.enabled !== false && d.state === "running";
  put("files-bar", "hidden", !run);
  if (run) $("files-fill").style.transform = "scaleX(" + (d.total ? clamp01((d.done || 0) / d.total) : 0).toFixed(3) + ")";
  renderBanner();
  renderDeep();
  renderListenTop();
}
function renderConn(){
  const el = $("conn");
  el.className = "conn" + (S.connected ? "" : " bad");
  el.innerHTML = S.connected ? '<span class="dot ok"></span>Live' : '<span class="dot bad"></span>Reconnecting';
}
$("s-files").addEventListener("click", function(e){ e.stopPropagation(); openDrawer(); });

/* What is on screen (E43): "Slide 4/6" beside the files count, the deck and slide title behind a
   hover. Nothing open is the normal case and draws nothing. */
const AX_FIX = "Allow Accessibility for Presage: System Settings › Privacy & Security › Accessibility";
function screenLabel(sc){
  const n = sc.page ? sc.page + (sc.pages ? "/" + sc.pages : "") : "";
  if (sc.kind === "deck" && n) return "Slide " + n;
  if ((sc.kind === "doc" || sc.kind === "browser") && n) return "Page " + n;
  if (sc.kind === "sheet" && sc.sheet) return sc.sheet;
  return String(sc.document || sc.file || "").replace(/\.[a-z0-9]{2,5}$/i, "");
}
function renderScreen(){
  const sc = S.screen || {}, ok = sc.status === "ok" && !!screenLabel(sc);
  put("s-screen", "hidden", !ok);
  if (!ok) return;
  const ax = sc.reason === "no_accessibility";
  put("d-screen", "class", "dot " + (ax ? "warm" : sc.presenting ? "accent" : "ok"));
  put("t-screen", "text", screenLabel(sc));
  put("s-screen", "title", [sc.document || sc.file, sc.title, sc.presenting ? "Presenting" : "", ax ? AX_FIX : ""]
    .filter(Boolean).join("\n"));
}
let screenPoll = true;
setInterval(async function(){
  if (!screenPoll || MOCK || GALLERY || !S.connected || document.hidden) return;
  const j = await api("/api/screen");
  if (j.error){ if (/404/.test(j.error)) screenPoll = false; return; }   // a server without the route
  S.screen = j; renderScreen();
}, 2000);

/* ----------------------------------------------------------------- modes */
function modeList(){ return (S.modes && S.modes.length) ? S.modes : MODE_FALLBACK; }
function activeMode(){ return String(S.settings.mode || "call"); }
function modeInfo(id){
  return modeList().find(function(m){ return m.id === id; }) || {id:id, label:id, hint:""};
}
function renderModes(){
  const cur = activeMode(), list = modeList();
  const html = list.map(function(m, i){
    return '<button data-m="' + esc(m.id) + '" title="' + esc(m.hint || m.label) + "  " + (i + 1) +
      '"' + (m.id === cur ? ' class="on"' : "") + ">" + esc(m.label) + "</button>";
  }).join("");
  if (LAST.modes !== html){ LAST.modes = html; $("modes").innerHTML = html; }
  const sel = $("mode-sel");
  if (document.activeElement !== sel){
    sel.innerHTML = list.map(function(m){
      return '<option value="' + esc(m.id) + '"' + (m.id === cur ? " selected" : "") + ">" + esc(m.label) + "</option>";
    }).join("");
  }
  $("deck").classList.toggle("quiet", cur === "quiet");
}
function setMode(id){
  if (!id || id === activeMode()) return;
  S.settings.mode = id;
  renderModes(); renderNotes(); renderAnswers();
  send({type:"set", key:"mode", value:id});
}
$("modes").addEventListener("click", function(e){
  const b = e.target.closest("button[data-m]");
  if (b) setMode(b.dataset.m);
});
$("mode-sel").addEventListener("change", function(){ setMode(this.value); });

/* ----------------------------------------------------------------- notes */
function nsec(title, items, cls, empty, cap){
  const use = (items || []).slice(0, cap);
  return '<div class="nsec ' + cls + '"><h4 class="cap">' + title + "</h4>" +
    (use.length ? "<ul>" + use.map(function(x){ return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>"
                : '<div class="none">' + esc(empty) + "</div>") + "</div>";
}
function notesBody(n){
  return nsec("Summary", n.summary, "", "Nothing yet", 5) +
         nsec("Actions", n.actions, "act", "None", 5) +
         nsec("Open", n.questions, "open", "None", 3);
}
function notesMeta(n){
  return (n.utterances ? '<span class="meta dim">' + esc(n.utterances) + " lines</span>" : "") +
         (n.ts ? '<span class="meta dim age" data-ts="' + esc(n.ts) + '">' + fmtAge(n.ts) + "</span>" : "");
}
/* Notes mode: the notes are the page, in the main column. Any other mode: a tab beside the
   transcript, which appears once a notes frame exists so switching modes never loses them. */
function renderNotes(){
  const n = S.notes, nm = activeMode() === "notes";
  const main = $("notes-main");
  main.hidden = !(nm && n);
  $("main").classList.toggle("notes-mode", nm && !!n);
  if (nm && n){
    main.innerHTML = '<div class="phead"><h2 class="cap">Notes</h2><span class="spacer"></span>' + notesMeta(n) +
      '</div><div class="ngrid">' + notesBody(n) + "</div>";
  } else main.innerHTML = "";

  const tabs = !!n && !nm;
  if (!tabs && S.tab === "notes") S.tab = "transcript";
  $("tabs").hidden = !tabs;
  $("tcap").hidden = tabs;
  $("npanel").innerHTML = tabs ? notesBody(n) : "";
  for (const b of $("tabs").querySelectorAll("button")) b.classList.toggle("on", b.dataset.tab === S.tab);
  if (S.tab === "notes") S.notesSeen = true;
  $("ndot").hidden = S.notesSeen;
  const onNotes = S.tab === "notes";
  $("tlines").hidden = onNotes;
  $("npanel").hidden = !onNotes;
  $("tmeta").innerHTML = onNotes && n ? notesMeta(n) : "";
  if (onNotes) $("latest").classList.remove("show");
}
$("tabs").addEventListener("click", function(e){
  const b = e.target.closest("button[data-tab]");
  if (!b || b.dataset.tab === S.tab) return;
  S.tab = b.dataset.tab;
  renderNotes();
  if (S.tab === "transcript") $("tlines").scrollTop = $("tlines").scrollHeight;
});

/* --------------------------------------------------------------- scratch */
/* Newest first, at most five. A row whose card was since replaced by an answer that is not
   derived (the hedge computed, the primary did not) is stale and dropped; that needs the
   row's `aid`, asked for in docs/frontend-asks.md, and is a no-op until the server sends it. */
function scratchRows(){
  const byId = new Map(S.answers.map(function(a){ return [a.id, a]; }));
  const out = [], seen = new Set();
  const items = (S.scratch || []).slice().reverse();
  for (const s of items){
    const a = s.aid ? byId.get(s.aid) : null;
    if (a && answeredFrom(a) !== "derived") continue;
    const k = (s.label || "") + "\u0000" + (s.value || "");
    if (s.value && seen.has(k)) continue;
    seen.add(k);
    out.push(s);
    if (out.length >= 5) break;
  }
  return out;
}
function scratchKey(s){ return (s.label || "") + "|" + (s.value || "") + "|" + (s.output || ""); }   // no NUL: the parser rewrites it inside attributes
function renderScratch(){
  const rows = scratchRows(), el = $("scratch");
  if (!rows.length){
    el.hidden = true; el.innerHTML = ""; LAST.scratch = ""; S.scratchKeys = new Set();
    return;
  }
  const html = scratchHTML(rows);
  el.hidden = false;
  if (LAST.scratch === html) return;
  LAST.scratch = html;
  el.innerHTML = html;
  const before = S.scratchKeys;
  S.scratchKeys = new Set(rows.map(scratchKey));
  if (before) for (const r of el.querySelectorAll(".srow")) if (!before.has(r.dataset.k)) r.classList.add("fresh");
}
function scratchHTML(rows){
  return '<div class="phead"><h2 class="cap">Scratch</h2><span class="spacer"></span>' +
    '<span class="meta dim num">' + rows.length + "</span></div>" +
    rows.map(function(s){
      const k = scratchKey(s), open = S.scratchOpen && S.scratchOpen.has(k);
      const card = s.aid ? S.answers.find(function(a){ return a.id === s.aid; }) : null;
      let det = "";
      if (open){
        det = '<div class="sdet">' +
          (s.working ? '<div class="sline">' + esc(s.working) + "</div>" : "") +
          (card && card.question ? '<div class="sline dim">' + esc(card.question) + "</div>" : "") +
          (card && card.answer ? '<div class="sline">' + esc(card.answer) + "</div>" : "") +
          (s.ts ? '<div class="sline dim num">' + esc(fmtAge(s.ts)) + "</div>" : "") + "</div>";
      }
      return '<div class="srow' + (s.value ? "" : " calc") + (open ? " open" : "") + '" data-k="' + esc(k) + '" title="' + esc(s.working || "") + '">' +
        '<span class="slab">' + esc(s.label || "") + "</span>" +
        '<span class="sval">' + esc(s.value || "") + "</span>" +
        '<span class="sarr">' + (s.value ? "→" : "") + "</span>" +
        '<span class="sout">' + esc(s.output || "") + "</span>" + det + "</div>";
    }).join("");
}
$("scratch").addEventListener("click", function(e){
  const row = e.target.closest(".srow");
  if (!row) return;
  S.scratchOpen = S.scratchOpen || new Set();
  if (S.scratchOpen.has(row.dataset.k)) S.scratchOpen.delete(row.dataset.k); else S.scratchOpen.add(row.dataset.k);
  LAST.scratch = ""; renderScratch();
});

/* --------------------------------------------------------------- answers */
function answeredFrom(a){
  if (a.answered_from) return a.answered_from;        // files | web | model | derived | none
  return a.in_files === false ? "none" : "files";     // messages from before web search
}
function host(u){
  try { return new URL(u).host.replace(/^www\./, ""); } catch(e){ return String(u || ""); }
}
const PROV = {files:["ok","Files"], web:["web","Web"], derived:["derived","Derived"], model:["warm","Suggested"]};
/* E68: a question the server gave up on, or has not answered yet, says why. Only `none` means the
   files lack it; slow is still looking, and empty / error / timeout are failures, not facts. */
function noAnswer(a){ return a && a.no_answer ? String(a.no_answer.reason || "none") : ""; }
function provHTML(a){
  if (a._heard) return '<span class="prov"><i class="dot accent pulse"></i>Heard</span>';
  if (a.partial) return '<span class="prov"><i class="dot accent pulse"></i>Writing</span>';
  const na = noAnswer(a);
  if (na === "slow") return '<span class="prov"><i class="dot warm pulse"></i>Still looking</span>';
  if (na && na !== "none")
    return '<span class="tag line" title="' + esc((a.no_answer && a.no_answer.detail) || a.answer || "") + '">No answer</span>';
  const from = answeredFrom(a);
  if (from === "none") return '<span class="tag bad">Not in files</span>';
  const p = PROV[from] || PROV.files;
  return '<span class="prov"><i class="dot ' + p[0] + '"></i>' + p[1] + "</span>";
}
function verdictHTML(a){
  const v = a.verdict;
  if (!v || answeredFrom(a) === "none") return "";         // Not in files already says it
  if (v.ok === false)
    return '<span class="tag bad" title="' + esc(v.reason || (v.problems || []).join("; ")) + '">Unverified</span>';
  if (v.level === "unverified")
    return '<span class="tag line" title="' + esc(v.reason || "No cited cell holds this number") + '">Uncited</span>';
  return "";
}
const FB = {used:["used","Used"], wrong:["wrong","Wrong"], good:["used","Good"], ignored:["line","Ignored"]};
function fbHTML(a){
  const f = FB[S.fb.get(a.id)];
  return f ? '<span class="tag ' + f[0] + '">' + f[1] + "</span>" : "";
}
function timingText(a){
  if (a.cached) return "Instant";                      // straight out of the deep index; "0 ms" says nothing more
  const w = a.source === "prefetch" ? "Prefetched" : a.source === "live" ? "Live" : "Manual";
  return w + (a.latency_ms != null ? " " + fmtLatency(a.latency_ms) : "");
}
function modeText(a){ return a.mode && a.mode !== "call" ? modeInfo(a.mode).label : ""; }
function basisHTML(a){
  const cites = a.citations || [], web = a.web_citations || [];
  if (!cites.length && !web.length) return "";
  let h = '<div class="basis">';
  for (const c of cites){
    h += '<span class="cite" title="' + esc(c.file + (c.loc ? " › " + c.loc : "")) + '"><b>' + esc(c.file) + "</b>" +
         (c.loc ? '<span class="sep">›</span>' + esc(c.loc) : "") + "</span>";
  }
  for (const c of web){
    h += '<a class="cite" href="' + esc(c.url) + '" target="_blank" rel="noopener noreferrer" title="' + esc(c.url) +
         '"><b>' + esc(c.title || host(c.url)) + "</b><i>↗</i></a>";
  }
  return h + "</div>";
}
function hasDetail(a){ return !!(a && !a.pending && !a._heard && !a.partial && String(a.say || "").trim() && a.answer); }
function canOpen(a){ return !!a && !a.pending && !a._heard && (!isTop(a) || hasDetail(a)); }   // a row always has its question and basis to show

/* The 1.5-second glance: figure, then the line you can say, then the basis. The full sentence
   only on More. Figure and say-line sit at fixed offsets from the card top, so the eye lands in
   the same place every time; the basis and status line pin to the bottom of the card. */
function topHTML(a){
  const say = String(a.say || "").trim();
  let h = '<div class="q">' + esc(a.question || "") + "</div>";
  const fig = a.figure ? fmtFigure(a.figure) : "";
  if (fig) h += '<div class="fig' + figClass(fig) + '" title="' + esc(fig) + '">' + esc(fig) + "</div>";
  h += say ? '<div class="say">' + esc(say) + "</div>" : '<div class="lede">' + esc(a.answer) + "</div>";
  if (a.working) h += '<div class="work">' + esc(a.working) + "</div>";
  if (a._open && hasDetail(a)) h += '<div class="detail">' + esc(a.answer) + "</div>";
  h += basisHTML(a);
  const mode = modeText(a);
  h += '<div class="status">' + provHTML(a) + verdictHTML(a) + whoHTML(a) +
       (a.partial || noAnswer(a) ? "" : '<span class="meta">' + esc(timingText(a)) + "</span>") +
       (mode ? '<span class="meta dim">' + esc(mode) + "</span>" : "") + fbHTML(a) +
       '<span class="spacer"></span><span class="age" data-ts="' + esc(a.ts) + '">' + fmtAge(a.ts) + "</span></div>";
  return h;
}
/* A question on its way to an answer: a placeholder where the figure will land, and the question
   itself where the say-line will, so the consultant can see at a glance the right one was caught. */
function pendingHTML(a){
  const mine = !a._heard || a.who === "Me";
  return '<div class="q">' + (mine ? "You asked" : "They asked") + '</div><div class="shimmer w1"></div>' +
    '<div class="lede asked">' + esc(a.question || "") + "</div>" +
    '<div class="status"><span class="prov"><i class="dot accent pulse"></i>' + (a._heard ? "Heard" : "Asking") + "</span>" +
    (a._heard ? '<span class="spacer"></span><span class="age" data-ts="' + esc(a.ts) + '">' + fmtAge(a.ts) + "</span>" : "") +
    "</div>";
}
function whoHTML(a){ return a.who === "Me" ? '<span class="who-me" title="You asked this">Me</span>' : ""; }
function topClass(a){
  const cls = ["top"];
  if (activeMode() === "notes") cls.push("compact");
  if (!a){ cls.push("empty"); return cls.join(" "); }
  if (a.pending || a._heard){ cls.push("pending"); return cls.join(" "); }
  const na = noAnswer(a);
  if (a.partial) cls.push("writing");
  else if (na === "slow") cls.push("waiting");
  else if (na && na !== "none") cls.push("noans");
  else if (answeredFrom(a) === "none") cls.push("miss");
  if (a.verdict && a.verdict.ok === false) cls.push("unver");
  if (a._open) cls.push("open");
  if (!hasDetail(a)) cls.push("static");
  return cls.join(" ");
}
function cardInnerHTML(a){ return !a ? emptyHTML() : (a.pending || a._heard) ? pendingHTML(a) : topHTML(a); }
function emptyHTML(){
  return "<span>" + esc(modeInfo(activeMode()).hint || "Answers appear here.") + "</span>";
}

function rowHTML(a){
  const say = String(a.say || "").trim();
  const mode = modeText(a);
  let h = '<div class="row">' +
    '<span class="rf' + (a.figure ? "" : " none") + '">' + esc(a.figure ? fmtFigure(a.figure) : "—") + "</span>" +
    '<span class="rs" title="' + esc(a.question || "") + '">' + esc(a._heard ? a.question || "" : say || a.answer || "") + "</span>" +
    '<span class="rp">' + fbHTML(a) + verdictHTML(a) + whoHTML(a) + provHTML(a) + "</span>" +
    '<span class="rend"><span class="age" data-short="1" data-ts="' + esc(a.ts) + '"></span>' +
      (a._heard ? "" : '<span class="racts">' +
        '<button class="kbd" data-fb="used" title="Used" aria-label="Mark used">U</button>' +
        '<button class="kbd" data-fb="wrong" title="Wrong" aria-label="Mark wrong">W</button></span>') + "</span></div>";
  if (a._open){
    h += '<div class="rdetail"><div class="q" style="white-space:normal">' + esc(a.question || "") + "</div>" +
      (say ? '<div class="ans">' + esc(a.answer || "") + "</div>" : "") +
      (a.working ? '<div class="work">' + esc(a.working) + "</div>" : "") + basisHTML(a) +
      '<div class="status"><span class="meta">' + esc(timingText(a)) + "</span>" +
      (mode ? '<span class="meta dim">' + esc(mode) + "</span>" : "") + "</div></div>";
  }
  return h;
}
function itemClass(a){
  const cls = ["item"];
  if (a.id === S.sel) cls.push("sel");
  if (a._open) cls.push("open");
  if (a._heard) cls.push("heard");
  else if (answeredFrom(a) === "none") cls.push("miss");
  if (a.verdict && a.verdict.ok === false) cls.push("unver");
  return cls.join(" ");
}

function viewList(){
  return S.pending ? [{pending:true, id:"_pending", question:S.pending.text, ts:now()}].concat(S.answers) : S.answers;
}
function renderAnswers(){
  const list = viewList();
  renderTop(list[0] || null);
  renderRows(list.slice(1));
  renderScratch();
  renderHints();
}
function renderTop(a){
  const el = $("top");
  el.hidden = !a && activeMode() === "notes" && !!S.notes;    // notes mode with notes: the notes are the page
  const cls = topClass(a);
  const html = cardInnerHTML(a);
  const anim = a && a._swap ? "swap" : a && a._new ? "arrive" : "";
  if (a){ a._new = false; a._swap = false; }
  const keep = !anim && (el.classList.contains("swap") ? " swap" : el.classList.contains("arrive") ? " arrive" : "");
  if (LAST.topHTML !== html){ LAST.topHTML = html; el.innerHTML = html; }
  el.className = cls + (keep || "");
  if (anim){ void el.offsetWidth; el.classList.add(anim); }
}
$("top").addEventListener("animationend", function(){ this.classList.remove("arrive", "swap"); });

/* Keyed: a row is rebuilt only when its own markup changed, and moved only when its place did.
   A streaming answer re-sends the same id every few hundred ms; this keeps that to one card. */
const ROWS = new Map();   // id -> {el, html}
function renderRows(list){
  const box = $("rows"), want = new Set(list.map(function(a){ return a.id; }));
  for (const [id, r] of ROWS) if (!want.has(id)){ r.el.remove(); ROWS.delete(id); }
  let prev = null;
  for (const a of list){
    let r = ROWS.get(a.id);
    if (!r){ r = {el: document.createElement("div"), html: ""}; r.el.dataset.id = a.id; ROWS.set(a.id, r); }
    const html = rowHTML(a);
    if (r.html !== html){
      r.html = html; r.el.innerHTML = html;
      const age = r.el.querySelector(".age");
      if (age) age.textContent = fmtShort(a.ts);
    }
    const cls = itemClass(a);
    if (r.el.className !== cls) r.el.className = cls;
    const slot = prev ? prev.nextSibling : box.firstChild;
    if (slot !== r.el) box.insertBefore(r.el, slot);
    prev = r.el;
  }
}

/* ------------------------------------------------ selection, More, feedback */
function selectedAnswer(){
  if (S.sel){
    const a = S.answers.find(function(x){ return x.id === S.sel; });
    if (a) return a;
    S.sel = null;
  }
  return S.pending ? null : (S.answers[0] || null);
}
function isTop(a){ return !S.pending && S.answers[0] === a; }
function moveSel(d){
  const list = S.answers;
  if (!list.length) return;
  const cur = selectedAnswer();
  let i = cur ? list.indexOf(cur) : -1;
  i = Math.max(0, Math.min(list.length - 1, i + d));
  S.sel = (i === 0 && !S.pending) ? null : list[i].id;
  renderAnswers();
  const r = S.sel && ROWS.get(S.sel);
  if (r) r.el.scrollIntoView({block:"nearest"});
  else $("rows").scrollTop = 0;
}
function toggleOpen(a){
  if (!a || a.pending || a._heard) return;
  a._open = !a._open;
  S.sel = isTop(a) ? null : a.id;
  renderAnswers();
  const r = S.sel && ROWS.get(S.sel);
  if (r) r.el.scrollIntoView({block:"nearest"});
}
function collapseAll(){
  for (const a of S.answers) a._open = false;
  S.sel = null;
  renderAnswers();
  $("rows").scrollTop = 0;
}
/* E12: the verdict goes to the log; the tag comes back as a `feedback` frame, so two screens agree. */
function mark(a, verdict){
  if (!a || a.pending || a._heard) return;             // nothing on screen yet to judge
  api("/api/feedback", "POST", {id:a.id, verdict:verdict});
  flashHint(verdict);
}
$("top").addEventListener("click", function(e){
  if (e.target.closest("a")) return;                 // citation links open, they do not expand
  const a = viewList()[0];
  if (!a || a.pending || !hasDetail(a)) return;
  toggleOpen(a);
});
$("rows").addEventListener("click", function(e){
  if (e.target.closest("a")) return;
  const item = e.target.closest(".item");
  if (!item) return;
  const a = S.answers.find(function(x){ return x.id === item.dataset.id; });
  const fb = e.target.closest("[data-fb]");
  if (fb){ e.stopPropagation(); mark(a, fb.dataset.fb); return; }
  if (e.target.closest(".rdetail")) return;
  toggleOpen(a);
});

/* A correction (the consultant said a figure the files contradict) and a drift card (a slide on
   screen quotes a number the model has moved past) answer nobody's question, so they never take
   the top card: they are the flag in the Answers header, with the detail one click away. */
function isCheck(a){ return a.answered_from === "correction" || a.answered_from === "drift"; }
function pushCheck(a){
  const had = S.checks.some(function(x){ return x.id === a.id; });
  S.checks = [a].concat(S.checks.filter(function(x){ return x.id !== a.id; })).slice(0, 5);
  renderChecks(!had);
}
function checkHTML(a){
  const drift = a.answered_from === "drift";
  const fig = a.figure ? fmtFigure(a.figure) : "";
  return '<div class="chk" data-id="' + esc(a.id) + '"><div class="chk-head"><i class="dot ' + (drift ? "warm" : "bad") + '"></i>' +
    '<span class="cap">' + (drift ? "Stale slide" : "Correction") + '</span><span class="spacer"></span>' +
    '<span class="age" data-ts="' + esc(a.ts) + '">' + fmtAge(a.ts) + "</span></div>" +
    (a.say ? '<div class="chk-say">' + esc(a.say) + "</div>" : "") +
    '<div class="chk-line">' + esc(a.question || "") + (fig ? ' <span class="sep">→</span> <b>' + esc(fig) + "</b>" : "") + "</div>" +
    (a.working ? '<div class="work">' + esc(a.working) + "</div>" : "") + basisHTML(a) +
    '<div class="status">' + fbHTML(a) + '<span class="spacer"></span>' +
      '<button class="kbd" data-fb="used" title="Used" aria-label="Mark used">U</button>' +
      '<button class="kbd" data-fb="wrong" title="Wrong" aria-label="Mark wrong">W</button></div></div>';
}
function renderChecks(fresh){
  const el = $("flag"), a = S.checks[0];
  if (!a){ el.hidden = true; closeFlag(); return; }
  const fig = a.figure ? fmtFigure(a.figure) : "";
  el.hidden = false;
  el.className = "flag" + (a.answered_from === "drift" ? " drift" : "");
  el.title = a.say || a.answer || "";
  el.innerHTML = '<i class="dot ' + (a.answered_from === "drift" ? "warm" : "bad") + '"></i>' +
    '<span class="fq">' + esc(a.question || "") + "</span>" +
    (fig ? '<span class="fa">→</span><span class="ff">' + esc(fig) + "</span>" : "") +
    (S.checks.length > 1 ? '<span class="more">+' + (S.checks.length - 1) + "</span>" : "");
  if (fresh){ void el.offsetWidth; el.classList.add("arrive"); }
  if ($("flagpop").classList.contains("open")) $("flagpop").innerHTML = S.checks.map(checkHTML).join("");
}
function closeFlag(){
  $("flagpop").classList.remove("open");
  $("flag").setAttribute("aria-expanded", "false");
}
$("flag").addEventListener("click", function(e){
  e.stopPropagation();
  const pop = $("flagpop"), open = !pop.classList.contains("open");
  if (open) pop.innerHTML = S.checks.map(checkHTML).join("");
  pop.classList.toggle("open", open);
  this.setAttribute("aria-expanded", open ? "true" : "false");
});
